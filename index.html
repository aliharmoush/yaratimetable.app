.es-in{height:27px!important;font-size:14.5px!important;font-weight:800!important;color:#0F1E3A}
.es-in::placeholder{font-size:13.5px;font-weight:800}
.es-n{height:17px!important;font-size:12px!important;font-weight:700!important;opacity:.9}
.es-n::placeholder{font-size:11px}
/* same teacher for other classes */
.es-fillb{position:absolute;top:100%;left:50%;transform:translate(-50%,-6px);z-index:6;white-space:nowrap;font:inherit;font-size:12.5px;font-weight:800;color:#fff;background:#2563EB;border:0;border-radius:8px;padding:4px 10px;cursor:pointer;box-shadow:0 4px 10px rgba(37,99,235,.35)}
.es-fillb:hover{background:#1D4ED8}
.es-fl{display:flex;flex-direction:column}
.es-fi{display:flex;align-items:center;padding:8px 8px;border-radius:9px;border-bottom:1px dashed #E2E8F0;cursor:pointer}
.es-fi:hover{background:#F8FAFC}.es-fi.on{background:#FFF7ED}
.es-fi input{width:18px;height:18px;margin:0;margin-inline-end:10px;accent-color:#EA580C}
.es-fi b{flex:1;font-size:14.5px}.es-fi small{color:#64748B;font-size:12.5px}.es-fi.has small{color:#B45309;font-weight:700}
/* locks */
.wcard.lk{box-shadow:inset 0 0 0 2px #0F1E3A;filter:saturate(.85)}
.tt-item.lk{outline:2px solid #0F1E3A;outline-offset:-2px}
.wl-lk{font-size:11px;margin-inline-end:3px}
.lk-w{position:relative;display:inline-block}
.lk-chip{font:inherit;font-weight:800;font-size:14px;border-radius:12px;padding:0 14px;min-height:46px;cursor:pointer;border:1.5px solid #CBD5E1;background:#fff;color:#475569;white-space:nowrap}
.lk-chip.on{border-color:#0F1E3A;color:#0F1E3A;background:#F1F5F9}
.lk-pop{position:absolute;top:110%;right:0;z-index:70;width:320px;background:#fff;border:1px solid #CBD5E1;border-radius:14px;box-shadow:0 18px 44px rgba(15,30,58,.25);padding:6px}
[dir=ltr] .lk-pop{right:auto;left:0}
.lk-ph{font-weight:900;padding:6px 8px;border-bottom:1px solid #E2E8F0}.lk-ph small{display:block;font-weight:500;color:#64748B;font-size:12px}
.lk-row{display:flex;align-items:center;padding:6px 8px;border-bottom:1px dashed #E2E8F0;font-size:13.5px}.lk-row span{color:#64748B;margin:0 8px;font-size:12.5px}
.lk-row button{font:inherit;border:1px solid #E2E8F0;background:#fff;border-radius:8px;cursor:pointer;padding:2px 7px}
.lk-empty{color:#64748B;font-size:13px;padding:8px;margin:0}
.lk-foot{display:flex;padding:6px 4px 2px}.lk-foot button{flex:1;font:inherit;font-weight:800;font-size:13px;border-radius:9px;padding:7px;cursor:pointer;border:1.5px solid #CBD5E1;background:#fff;margin:0 3px}
.lk-foot button.a{background:#0F1E3A;color:#fff;border-color:#0F1E3A}.lk-foot button:disabled{opacity:.4}
.tt-manual{font:inherit;font-weight:800;font-size:15px;border-radius:12px;padding:0 16px;min-height:46px;cursor:pointer;border:1.5px solid #0F766E;background:#F0FDFA;color:#0F766E;white-space:nowrap}
@media (max-width:640px){.lk-pop{position:fixed!important;left:10px!important;right:10px!important;top:auto!important;bottom:10px;width:auto!important}}
/* trial watermark over the timetable */
.wm-host{position:relative}
.wm{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;pointer-events:none;z-index:3}
.wm-in{position:absolute;left:-30%;right:-30%;top:-40%;transform:rotate(-12deg)}
.wm-l{white-space:nowrap;font-weight:900;font-size:30px;line-height:1.25;color:rgba(185,28,28,.55);background:rgba(255,255,255,.72);border-top:2px solid rgba(185,28,28,.5);border-bottom:2px solid rgba(185,28,28,.5);padding:2px 0;margin-bottom:120px;text-align:center}
.wm-ban{display:flex;align-items:center;background:#FEF2F2;border:1.5px solid #FCA5A5;border-radius:12px;padding:9px 14px;color:#991B1B;font-weight:800;font-size:14px;margin-bottom:8px}
.wm-ban span{flex:1}
.wm-go{background:#DC2626;color:#fff!important;border-radius:9px;padding:6px 14px;font-size:14px;text-decoration:none;white-space:nowrap}
/* Ctrl+P before the subscription: a blank page with one line */
@media print{
  body.sub-off *{visibility:hidden!important}
  body.sub-off::after{content:"الطباعة متاحة بعد تفعيل الاشتراك · yaratimetable.app";visibility:visible!important;position:fixed;top:40%;left:0;right:0;text-align:center;font:700 22px "IBM Plex Sans Arabic",Tahoma,sans-serif;color:#000}
}
/* teacher times: periods and free time next to the name */
.tm-who{flex-wrap:wrap}
.tm-chip{display:inline-flex;align-items:center;background:#F1F5F9;border:1.5px solid #CBD5E1;border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700;color:#334155;margin-inline-start:8px;white-space:nowrap}
.tm-chip b{font-size:17px;font-weight:900;margin-inline-start:6px;color:#0F1E3A}
.tm-chip.ok{background:#F0FDF4;border-color:#86EFAC;color:#15803D}.tm-chip.ok b{color:#15803D}
.tm-chip.bad{background:#FEF2F2;border-color:#FCA5A5;color:#B91C1C}.tm-chip.bad b{color:#B91C1C}
/* teacher times: a period number marks that period on every day */
.tm-col{border:0;background:none;font:inherit;font-weight:900;font-size:15px;color:#1E3A8A;width:100%;height:34px;cursor:pointer;border-radius:6px}
.tm-col:hover:not(:disabled){background:#E0E7FF}
.tm-col.off{background:#FECACA;color:#991B1B}
.tm-grid thead th{padding:0}
/* times page: teachers | classes tabs */
.tm-tabs{display:inline-flex;background:#E2E8F0;border-radius:12px;padding:4px;margin-bottom:8px}
.tm-tabs button{font:inherit;font-weight:800;font-size:15px;color:#475569;background:none;border:0;border-radius:9px;padding:8px 20px;cursor:pointer}
.tm-tabs button.on{background:#fff;color:#1E3A8A;box-shadow:0 2px 6px rgba(0,0,0,.1)}.tm-tabs button.on.cl{color:#C2410C}
.tm-hint.cl{background:#FFF7ED;border-color:#FDBA74;color:#9A3412}
.tm-g{display:flex;align-items:center}
.tm-gb{font-size:12px;font-weight:800;background:#DCFCE7;color:#15803D;border-radius:99px;padding:1px 8px;margin-inline-start:auto}
.tm-gb.sp{background:#FFEDD5;color:#C2410C}.tm-gb.bad{background:#FEE2E2;color:#B91C1C}
.tm-t.on .tm-gb{background:#fff}
.tm-name.cl{color:#C2410C;cursor:default}
.tm-secs{color:#64748B;font-size:12.5px;margin-inline-start:6px}
.tm-legend{font-size:13px;color:#475569;margin:8px 0 0}
.es-tmb{font:inherit;font-size:11.5px;font-weight:800;color:#C2410C;background:#FFEDD5;border:1px solid #FDBA74;border-radius:99px;padding:0 6px;margin-inline-start:4px;cursor:pointer;vertical-align:middle}
.es-row .es-tmb{display:table;margin:2px auto 0;line-height:1.5}
/* times page: two big clear tabs */
.tm-tabs2{display:flex;margin-bottom:10px}
.tt2{flex:1;display:flex;align-items:center;text-align:start;font:inherit;border:2px solid #E2E8F0;background:#fff;border-radius:16px;padding:10px 16px;margin-inline-end:12px;cursor:pointer;color:#475569;box-shadow:0 2px 8px rgba(15,30,58,.05)}
.tt2:last-child{margin-inline-end:0}
.tt2 .ic{font-size:30px;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#F1F5F9;margin-inline-end:12px;flex:none}
.tt2 .tx{flex:1}.tt2 b{display:block;font-size:19px;font-weight:900}.tt2 small{display:block;font-size:13px;color:#64748B;margin-top:2px}
.tt2 .n{font-size:15px;font-weight:900;border-radius:99px;padding:3px 12px;background:#F1F5F9;color:#475569}
.tt2:hover{border-color:#CBD5E1}
.tt2.t.on{border-color:#2563EB;background:linear-gradient(135deg,#EFF6FF,#fff);color:#1E3A8A;box-shadow:0 6px 18px rgba(37,99,235,.18)}
.tt2.t.on .ic{background:#2563EB}.tt2.t.on .n{background:#2563EB;color:#fff}
.tt2.c.on{border-color:#EA580C;background:linear-gradient(135deg,#FFF7ED,#fff);color:#9A3412;box-shadow:0 6px 18px rgba(234,88,12,.18)}
.tt2.c.on .ic{background:#EA580C}.tt2.c.on .n{background:#EA580C;color:#fff}
.tt2:not(.on){opacity:.85}
@media (max-width:640px){.tt2 .ic{width:40px;height:40px;font-size:22px}.tt2 b{font-size:16px}.tt2 small{display:none}}
.tm-t.tm-g.on{background:#EA580C!important;border-color:#EA580C!important;color:#fff}
/* times page: the two tabs stacked at the top of the side list */
.tm-tabs3{display:flex;flex-direction:column;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #E2E8F0}
.tt3{display:flex;align-items:center;width:100%;text-align:start;font:inherit;border:2px solid #E2E8F0;background:#fff;border-radius:12px;padding:6px 10px;margin-bottom:6px;cursor:pointer;color:#475569}
.tt3:last-child{margin-bottom:0}
.tt3 .ic{font-size:20px;margin-inline-end:8px}
.tt3 b{flex:1;font-size:18px;font-weight:900}
.tt3 .n{font-size:13px;font-weight:900;border-radius:99px;padding:1px 9px;background:#F1F5F9}
.tt3.t.on{border-color:#2563EB;background:#EFF6FF;color:#1E3A8A}.tt3.t.on .n{background:#2563EB;color:#fff}
.tt3.c.on{border-color:#EA580C;background:#FFF7ED;color:#9A3412}.tt3.c.on .n{background:#EA580C;color:#fff}
.tm-title b.cl{color:#C2410C}
/* teacher card v3 */
.tc2-head .tm-chip{margin-inline-start:6px}
.tc3-name{font:inherit;font-size:21px;font-weight:900;color:var(--ink);background:none;border:1.5px dashed transparent;border-radius:8px;padding:0 6px;cursor:pointer;display:inline-flex;align-items:center}
.tc3-name:hover:not(:disabled){border-color:#CBD5E1}.tc3-name i{font-style:normal;font-size:13px;margin-inline-start:8px;opacity:.6}
.tc3-name:disabled{cursor:default}
.tc3-nin{font-size:19px!important;font-weight:800;max-width:320px;height:36px}
.tc2-head small{display:block;padding:0 6px}
.tc3-del{border:0;background:none;font-size:18px;cursor:pointer;margin-inline-start:8px;opacity:.75}.tc3-del:hover{opacity:1}
.tc3-short{cursor:pointer;font:inherit}
.tc3-info{display:flex;flex-wrap:wrap;align-items:flex-end;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:6px 10px;margin-bottom:10px}
.tc3-info .tcard-f{margin:0;margin-inline-end:16px;width:auto;flex:0 1 auto}
.tc3-info label{font-size:12px}
.tc3-info .input{height:32px;font-size:13.5px}
.tc3-info .tcard-phone .input{width:150px}
.tc3-tbl{width:100%;border-collapse:collapse}
.tc3-tbl th,.tc3-tbl td{border:1px solid #CBD5E1;padding:5px 8px}
.tc3-tbl thead th{background:#EFF6FF;color:#1E3A8A;font-weight:800;font-size:12.5px;text-align:start}
.tc3-tbl .n{text-align:center;width:110px}
.tc3-tbl tfoot td{background:#F8FAFC;font-weight:800}
.tc3-step{display:inline-flex;align-items:center;border:1px solid #CBD5E1;border-radius:8px;overflow:hidden;background:#fff}
.tc3-step button{width:24px;height:26px;border:0;background:#F1F5F9;font-weight:900;cursor:pointer;font-size:14px}
.tc3-step button:disabled{opacity:.35;cursor:default}
.tc3-step b{min-width:30px;text-align:center}
/* teachers page v3 */
.tl-load{display:block;color:#EA580C;font-weight:800;font-size:12.5px;margin-top:2px}
.tl-tbl tbody tr:nth-child(even) td,.tl-tbl tbody tr:nth-child(even) th{background:#FFFBF7}
.tl-tbl tbody tr:hover td,.tl-tbl tbody tr:hover th{background:#FFF7ED}
.tl-tbl thead th{position:sticky;top:0;z-index:2}
.tl-ch{cursor:pointer}
.tl-chg-r{display:flex;align-items:center;padding:8px 6px;border-bottom:1px dashed #E2E8F0}
.tl-chg-r b{width:150px}.tl-chg-r small{flex:1;color:#64748B}
.tl-chg-r select{width:220px;height:34px}
.tl-chg-r.all{background:#F8FAFC;border-radius:8px}.tl-chg-r.all b{flex:1}
.tl-chg-r.ch{background:#F0FDF4}.tl-chg-r.ch select{border-color:#16A34A;color:#15803D;font-weight:700}
.tl-chg-msg{font-size:12.5px;color:#15803D;font-weight:700}
.tl-tbl .tl-load{color:#EA580C!important;font-size:13px!important;font-weight:800!important}
.tl-tbl .tl-emp{max-width:140px}
.sb-tb{font:inherit;font-size:12.5px;font-weight:700;color:#1E3A8A;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:99px;padding:1px 9px;margin:1px 2px;cursor:pointer;white-space:nowrap}
.sb-tb:hover:not(:disabled){background:#DBEAFE}.sb-tb:disabled{cursor:default}
.tl-tbl thead th:nth-child(3){width:160px}.tl-tbl thead th:nth-child(2){width:220px}.tl-tbl thead th:last-child{width:56px}

/* finished-programme question */
.guard-wrap{position:relative;z-index:400}
.guard-wrap .modal-back{z-index:400}
.guard-modal{max-width:640px}
.guard-p{margin:0;font-size:16px;line-height:1.8;text-align:center;color:#12223F;font-weight:700}
.guard-p.ok{margin-top:10px;background:#ECFDF5;color:#047857;border-radius:12px;padding:10px 12px}
.guard-modal .modal-foot .btn{margin-inline-start:8px}

/* teachers page: colourful cards (different from the entry sheet grid) */
.tl-c.good b{color:#15803D}
.tl-flt button i{font-style:normal;opacity:.75;font-size:11.5px;margin-inline-start:2px}
.tl-flt button.bad{border-color:#FCA5A5;color:#B42318}
.tl-flt button.bad.on{background:#DC2626;border-color:#DC2626;color:#fff}
.tl-sort{border:1.5px solid #CBD5E1;background:#fff;border-radius:99px;padding:3px 11px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:#334155}
.tg-wrap{border:0;background:none;overflow:auto}
.tg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-gap:10px}
.tg-card{background:#fff;border:2px solid #E2E8F0;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;transition:box-shadow .15s}
.tg-card:hover{box-shadow:0 6px 18px rgba(15,30,58,.1)}
.tg-card.short{background:#FFF8F8}
.tg-card.off{opacity:.5}
.tg-card.tc-flash{box-shadow:0 0 0 3px #EA580C}
.tg-top{display:flex;align-items:center}
.tg-ava{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-inline-end:10px;font-family:var(--head)}
.tg-who{flex:1;min-width:0;display:block}
.tg-name{display:block;border:0;background:none;padding:0;font:inherit;font-family:var(--head);font-weight:800;font-size:16px;color:#12223F;cursor:pointer;text-align:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-name:hover{color:#EA580C;text-decoration:underline}
.tg-emp{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 9px;margin-top:2px}
.tg-acts{flex:0 0 auto;display:flex}
.tg-acts button{border:0;background:#F1F5F9;color:#475569;width:30px;height:30px;border-radius:9px;cursor:pointer;margin-inline-start:4px;display:flex;align-items:center;justify-content:center;padding:0}
.tg-acts button:hover{background:#E2E8F0}
.tg-acts button.red{background:#FEF2F2;color:#B42318}
.tg-subs{display:flex;flex-wrap:wrap;margin:8px 0 6px;min-height:26px}
.tg-sub{border:0;border-radius:8px;padding:3px 8px;margin:0 0 4px 4px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:#fff;background:var(--c,#64748B)}
.tg-sub b{background:rgba(255,255,255,.3);border-radius:6px;padding:0 5px;margin-inline-start:3px}
.tg-sub:hover{filter:brightness(1.08)}
.tg-none{font-size:12.5px;color:#94A3B8;font-weight:700;padding:3px 0}
.tg-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed #E2E8F0;padding-top:6px;margin-top:auto;font-size:12.5px}
.tg-load{font-weight:800;color:#1E3A6B}.tg-load small{color:#64748B;font-weight:700}
.tg-warn{background:#FEE2E2;color:#B42318;border-radius:99px;padding:1px 9px;font-weight:800}
.tg-off{color:#B45309;font-weight:700}
@media (max-width:600px){.tg-grid{grid-template-columns:1fr}.tl-sum .tl-c b{font-size:18px}}

/* teacher popup: two columns, no page scroll */
.modal.tcard-modal.tc-small{max-width:900px}
.tc4-head{display:flex;align-items:center;padding:2px 2px 10px;border-bottom:1px solid #E2E8F0;margin-bottom:10px}
.tc4-head .tg-ava{width:46px;height:46px;font-size:17px}
.tc4-head .tm-chip{margin-inline-start:6px}
.tc4-head .tc3-name{font-size:19px}

.tc4-add{border:0;background:#FFF7ED;color:#C2410C;border-radius:8px;padding:3px 10px;font:inherit;font-weight:800;font-size:12.5px;cursor:pointer}

.tc4-sub{border:0;color:#fff;border-radius:8px;padding:3px 8px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;margin-inline-end:6px}
.tc4-cls{flex:1;min-width:0;font-size:13px;font-weight:700}
.tc4-n{margin:0 8px}

.tc4-ib button.red{background:#FEF2F2;color:#B42318}

.tc4 .tc4-grid td.on button{background:#DCFCE7;color:#166534;height:30px;font-size:14px}
.tc4 .tc4-grid td.off button{background:#FEE2E2;color:#B91C1C;height:30px;font-size:14px}

.tc4 .tc4-grid tbody th{width:56px;font-size:12px}

.tc4-foot .btn{margin-inline-end:6px}
.tc4-msg{margin:0;background:#ECFDF5;color:#047857;border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px}

.tc4-secs{display:flex;flex-wrap:wrap}

.tc4-sec b{display:block;font-size:14px;color:#12223F}.tc4-sec small{display:block;font-size:11.5px;color:#15803D;font-weight:700}
.tc4-sec.busy{border-color:#FED7AA;background:#FFF7ED}.tc4-sec.busy small{color:#C2410C}
.tc4-sec.on{border-color:#EA580C;box-shadow:0 0 0 2px #EA580C}
.tc4-opt label{display:block;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:7px 10px;margin-top:6px;cursor:pointer;font-size:14px}
@media (max-width:760px){.tc4-body{display:block}.tc4-r{margin:0 0 10px}.tc4-head{flex-wrap:wrap}}
.tc4-foot{flex-wrap:wrap}
.tc4-foot .btn{margin-top:4px}
@media (max-width:760px){.tc4-foot .grow{display:none}.tc4-head .tc3-name{font-size:16px}}

/* timetable after generation: brighter colours, clear days and periods */
.shell table.whole,table.whole{border-collapse:separate;border-spacing:0}
.whole th,.whole td{border:0;border-bottom:1px solid #CBD5E1;border-inline-end:1px solid #E2E8F0}
.whole td.wc{height:30px;min-width:34px;padding:2px;background:#F8FAFC}
.whole .dayend,.whole th.dayend,.whole td.dayend{border-inline-end:4px solid #1E293B}
.whole th.wd{border-inline-start:0;border-inline-end:4px solid #1E293B;background:#1E3A6B;color:#fff;font-size:13.5px;font-weight:800;padding:4px}
.whole th.wn{background:#E2E8F0;color:#1E293B;font-weight:800}
.whole tbody th.wl{border-inline-end:3px solid #1E293B;background:#F1F5F9}
.wcard{filter:saturate(1.45) brightness(1.06);border-radius:6px;margin:0;min-height:26px;font-size:12px;font-weight:800;box-shadow:0 1px 2px rgba(15,30,58,.3);cursor:pointer}
.wcard:hover{filter:saturate(1.6) brightness(1.12);transform:translateY(-1px)}
.whole td.wc.held .wcard{outline:3px solid #F5A524;outline-offset:1px}
.shell .tt-grid td.tt-cell{padding:3px;background:#F8FAFC}
.tt-item{color:#fff;border-radius:8px;filter:saturate(1.45) brightness(1.06);border-inline-start:0!important;cursor:pointer;box-shadow:0 1px 2px rgba(15,30,58,.3)}
.tt-item b,.tt-item span{color:#fff!important;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.tt-item.held{outline:3px solid #F5A524;outline-offset:1px}
.tt-grid th.c{border-inline-end:3px solid #1E293B}
/* targets while a lesson is held */
.whole td.can,.tt-grid td.tt-cell.can{background:#BBF7D0!important;box-shadow:inset 0 0 0 2px #16A34A;cursor:pointer}
.whole td.can.swap,.tt-grid td.tt-cell.can.swap{background:#FED7AA!important;box-shadow:inset 0 0 0 2px #EA580C}
.whole td.cant,.tt-grid td.tt-cell.cant{background:#FECACA!important;cursor:not-allowed}
.whole td.cant .wcard,.tt-grid td.cant .tt-item{opacity:.55}
.whole tr.w-focus td.can{background:#BBF7D0!important;outline:0}
.whole tr.w-focus td.can.swap{background:#FED7AA!important}
.whole tr.w-focus td.cant{background:#FECACA!important}
/* undo */
.tt-undo{display:flex;align-items:center;justify-content:center;background:#ECFDF5;color:#047857;border:1.5px solid #6EE7B7;border-radius:10px;padding:4px;margin-top:8px;font-weight:800}
.tt-undo button{border:1.5px solid #047857;background:#fff;color:#047857;border-radius:8px;padding:2px 12px;font:inherit;font-weight:800;margin-inline-start:12px;cursor:pointer}
/* left-over lessons panel: resizable */
.cards{position:relative;padding-top:14px!important}
.cards.min{padding-top:8px!important;min-height:0}
.cards.min .cards-head{margin-bottom:0}
.cards.target{background:#FEF3C7!important;outline:3px dashed #EA580C;cursor:pointer}
.tray-handle{position:absolute;top:0;left:0;right:0;height:14px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
.tray-handle i{display:block;width:56px;height:5px;border-radius:5px;background:#D97706;opacity:.7}
.tray-handle:hover i{opacity:1;width:80px}
body.tray-dragging,body.tray-dragging *{cursor:ns-resize!important;user-select:none}
.cards-list.sized{overflow:auto}
.cards-head .grow{flex:1}
.tray-tog{border:1.5px solid #F59E0B;background:#fff;color:#B45309;border-radius:8px;width:30px;height:26px;font-weight:800;cursor:pointer;margin-inline-start:6px}
.tt-help{border:0;background:#1E3A6B;color:#fff;border-radius:9px;padding:5px 12px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.tt-help-opt{display:flex;align-items:center;background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:12px;padding:8px 10px;margin-top:8px;font-size:14.5px;line-height:1.6}
.tt-help-opt.two{background:#FFF7ED;border-color:#FDBA74}
.tt-help-opt .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#1E3A6B;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;margin-inline-end:10px}
.tt-help-opt .btn{margin-inline-start:10px}
.tt-help-none{margin:0;background:#FEF2F2;color:#B42318;border-radius:10px;padding:10px;font-weight:700}
@media print{.wcard,.tt-item{box-shadow:none;filter:none}.eco-print .tt-item b,.eco-print .tt-item span{color:#000!important;text-shadow:none}}
</style>
</head>
