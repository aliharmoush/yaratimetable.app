.sadd{min-height:36px}
.scard-time .sfield>label{margin-bottom:2px}.scard-time .sdays{margin-bottom:4px}
.scard>header{min-height:40px;padding:4px 14px;margin-bottom:8px}.scard{margin-bottom:6px;padding-bottom:8px}.sfields{row-gap:4px}.slogo .logo-box{width:56px;height:56px}
.sbreak .sbmin{width:56px}.sbreak select.input{flex-basis:52px;width:52px}
.shell .side a.nv-assign .nvt{font-size:14px;white-space:nowrap;letter-spacing:-.2px}
/* === colored toolbar buttons (all pages) === */
.shell .toolbar .btn-ghost[data-ic]{border-width:1.5px;font-weight:800}
.shell .toolbar .btn-ghost[data-ic=eye]{color:#7C3AED;border-color:#DDD0FB;background:#F7F3FF}
.shell .toolbar .btn-ghost[data-ic=edit]{color:#2563EB;border-color:#C9DAFB;background:#F2F6FF}
.shell .toolbar .btn-ghost[data-ic=trash]{color:#DC2626;border-color:#F7C8C8;background:#FFF4F4}
.shell .toolbar .btn-ghost[data-ic=clock]{color:#0F766E;border-color:#BFE7E1;background:#F0FBF9}
.shell .toolbar .btn-ghost[data-ic=table]{color:#B45309;border-color:#F6DDB0;background:#FFF9EE}
.shell .toolbar .btn-ghost[data-ic=plus]{color:#059669;border-color:#BDEBD8;background:#F0FCF7}
.shell .toolbar .btn-ghost[data-ic=layers]{color:#DB2777;border-color:#F8CDE1;background:#FFF3F8}
.shell .toolbar .btn-ghost[data-ic]:hover:not(:disabled){filter:brightness(.96)}
.shell .toolbar .btn-ghost[data-ic]:disabled{opacity:.55}
/* teachers */
.tc-row td:nth-child(2){box-shadow:inset -5px 0 0 var(--tcc)}
.tc-name{color:var(--tcc)!important;font-family:var(--head);font-weight:800;font-size:16px;text-decoration:none!important;border:0!important}
.tc-subs{display:flex;flex-wrap:wrap;gap:5px}
.tc-sub{display:inline-flex;align-items:center;gap:5px;background:var(--c);color:#fff;border-radius:9px;padding:3px 10px;font-size:14.5px;font-weight:800;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.tc-sub b{background:rgba(255,255,255,.3);border-radius:6px;padding:0 6px;font-family:'Space Grotesk',sans-serif}
.tc-load{display:inline-flex;min-width:42px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#FFF1E8;color:#C2410C;font-family:'Space Grotesk',sans-serif;font-size:18px}
.tc-load.over{background:#FDECEA;color:#B42318}
/* assign page */
.shell .as-tbl{font-size:16px}
.shell .as-tbl th{font-size:15.5px!important;font-weight:800}
.as-subj{width:1%;white-space:nowrap}
.as-n{width:1%;white-space:nowrap}
.as-n b{display:inline-flex;min-width:38px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#FDEDF5;color:#BE185D;font-family:'Space Grotesk',sans-serif;font-size:18px}
.as-chip{display:inline-block;background:var(--c);color:#fff;border-radius:9px;padding:4px 12px;font-weight:800;font-size:15.5px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.as-multi{display:inline-flex;align-items:center;gap:3px;margin-inline-start:6px;border:1.5px dashed #F472B6;background:#fff;color:#BE185D;border-radius:8px;padding:2px 8px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;vertical-align:middle}
.as-multi:hover{background:#FDF2F8}
.shell .as-tbl select.as-sel{font-size:15px;min-height:36px}
.shell .as-grades{gap:5px}
.shell .as-grades button{font-size:16px;font-weight:800;min-height:40px;border-radius:10px;color:var(--gc,#1E3A8A);border:1.5px solid color-mix(in srgb,var(--gc,#2563EB) 30%,#fff);background:color-mix(in srgb,var(--gc,#2563EB) 6%,#fff);border-inline-start:5px solid var(--gc,#2563EB)}
.shell .as-grades button[aria-pressed=true]{background:var(--gc,#2563EB);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--gc,#2563EB) 35%,transparent)}
.shell .as-grades button .ok{color:inherit}
.mu-top{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:6px}
.mu-top label{font-weight:800;color:#C2410C}
.mu-top select{max-width:360px;width:100%;font-size:16px}
.mu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;max-height:46vh;overflow:auto}
.mu-c{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;border:1.5px solid color-mix(in srgb,var(--gc) 30%,#fff);border-inline-start:5px solid var(--gc);border-radius:10px;padding:6px 10px;cursor:pointer;background:#fff}
.mu-c.on{background:color-mix(in srgb,var(--gc) 10%,#fff)}
.mu-c input{grid-row:1/3}
.mu-n{font-weight:800;color:var(--gc);font-size:15.5px}
.mu-p{font-family:'Space Grotesk',sans-serif;font-size:17px}
.mu-c small{grid-column:2/4;color:#64748B;font-size:12.5px}
.mu-sum{text-align:center;margin-top:8px;font-weight:800;color:#BE185D}
/* lesson dialog: other classes */
.ls-more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-top:6px;max-height:180px;overflow:auto}
.ls-mo{border:1.5px solid #D6E2FB;border-radius:9px;padding:4px 8px;background:#fff;font-weight:700}
.ls-mo.on{background:#EAF1FF;border-color:#2563EB}
.ls-mo.mine{background:#ECFDF5;border-color:#10B981;opacity:.85}
.ls-mo b{margin-inline-start:auto;font-family:'Space Grotesk',sans-serif;color:#1D4ED8}
.ls-mo{display:flex;align-items:center;gap:6px}
.shell .as-grades{flex:0 0 150px;width:150px}
.shell .as-grades button{white-space:nowrap;font-size:15px;justify-content:space-between}
/* timetable: centered big actions, full class names */
.pg-timetable .page-head{position:relative}
.tt-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:10px;align-items:center}
.tt-center .btn-generate{font-size:20px!important;min-height:54px!important;padding:0 30px!important}
.tt-center .tt-test{min-height:50px;font-size:17px;padding:0 20px;border:2px solid #10B981;color:#047857;background:#ECFDF5;font-weight:800}
.tt-center .tt-test:hover{background:#D1FAE5}
@media (max-width:1100px){.tt-center{position:static;transform:none}}
.whole th.wl{font-size:13.5px!important;font-weight:800;color:#1E3A8A;padding:0 8px!important;width:auto!important;min-width:70px}
.pg-timetable .page-head p{max-width:24vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* page titles: centered and bigger (all pages except the timetable which has its big buttons in the middle) */
.shell .main:not(.pg-timetable) .page-head{position:relative;min-height:52px;justify-content:flex-end}
.shell .main:not(.pg-timetable) .page-head>div:first-child{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:0;pointer-events:none;max-width:46%}
.shell .main:not(.pg-timetable) .page-head::before{display:none}
.shell .main:not(.pg-timetable) .page-head h1{font-size:27px!important;display:inline-block;padding-bottom:2px;border-bottom:4px solid var(--acc,#F5A524);border-radius:2px}
.shell .main:not(.pg-timetable) .page-head p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell .main:not(.pg-timetable) .page-actions{margin-inline-start:auto;flex-direction:row-reverse}
/* teacher form */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.sbox{background:#FFF8E6;border:1px solid #F7D9A0;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13.5px;text-align:center}
.shell .main:not(.pg-timetable) .page-head>div:first-child{max-width:34%}
.pg-teachers .page-head p,.pg-subjects .page-head p,.pg-assign .page-head p{display:none}
.shell .main:not(.pg-timetable) .page-head>div:first-child{position:static;transform:none;flex:1;max-width:none;min-width:0}
.ls-rem{margin-top:6px;text-align:center;font-weight:800;font-size:14px;background:#ECFDF5;color:#047857;border-radius:9px;padding:5px 8px}
.ls-rem.over{background:#FDECEA;color:#B42318}
.tc-load{min-width:64px;padding:0 8px}
.tc-rem{font-size:12px;font-weight:800;color:#047857;margin-top:2px}.tc-rem.over{color:#B42318}
.rstaff-sum{width:auto!important;min-width:420px;margin:0 auto 10px}
.rstaff-sum td,.rstaff-sum th{padding:5px 14px!important;font-size:14px}
.rstaff-sum tr.tot{background:#FFF7E0}
.rstaff tr.grp th{background:#EEF2FF;color:#1E3A8A;text-align:start;font-size:13.5px;padding:5px 10px}
.rstaff td.subs{text-align:start;font-size:12.5px}
.rstaff{table-layout:auto!important}
.rstaff th:nth-child(1),.rstaff td:nth-child(1){width:34px}
.rstaff th:nth-child(3),.rstaff td:nth-child(3){width:110px}
.rstaff th:nth-child(5),.rstaff td:nth-child(5){width:80px}
.rstaff th:nth-child(4),.rstaff td:nth-child(4){width:auto}
.rstaff-sum{table-layout:auto!important}
.rstaff-sum th.nm{white-space:nowrap}
/* ===== My programs ===== */
.pg-programs{--acc:#7C3AED;--acc-s:#F3EEFF}
.nv-programs .nvi{background:linear-gradient(135deg,#F59E0B,#FBBF24)}
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;background:#fff;border:1px solid #E1E6EF;border-radius:14px;padding:8px 14px}
.pg-plan{font-weight:800;color:#5B21B6;font-size:15px}
.pg-new{background:linear-gradient(135deg,#7C3AED,#A78BFA)!important;border:0}
.pg-limit{font-weight:700;color:#92400E;background:#FFF8E6;border-radius:9px;padding:5px 10px;font-size:13.5px}
.pg-sec{margin-bottom:14px}
.pg-h{font-family:var(--head);font-size:19px;font-weight:800;margin:4px 2px 8px}
.pg-h.done{color:#047857}.pg-h.wip{color:#B45309}
.pg-h small{color:#64748B;font-size:14px}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.pg-card{background:#fff;border:1px solid #E1E6EF;border-radius:16px;padding:12px 14px;box-shadow:var(--sh1);border-top:5px solid #F59E0B;display:flex;flex-direction:column;gap:8px}
.pg-card.fin{border-top-color:#10B981}
.pg-card.cur{box-shadow:0 0 0 3px #C4B5FD,var(--sh1)}
.pg-top{display:flex;align-items:center;gap:10px}
.pg-ic{font-size:26px}
.pg-name{font-family:var(--head);font-size:18px;color:#0E1F3D;display:block}
.pg-label{color:#6D28D9;font-weight:700;font-size:14px}
.pg-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:#475569}
.pg-acts{display:flex;flex-wrap:wrap;gap:6px}
.pg-acts .btn{min-height:34px;font-size:14px}
.pg-copy{color:#6D28D9!important;border-color:#DDD0FB!important;background:#F7F3FF!important}
.pg-empty{color:#64748B;background:#fff;border:1px dashed #CBD5E1;border-radius:12px;padding:12px;text-align:center}
.prog-chip{display:inline-flex;align-items:center;gap:6px;max-width:42vw;background:#FFF8E6;border:1.5px solid #F7D9A0;color:#78350F;border-radius:999px;padding:4px 12px;text-decoration:none;font-size:13.5px;white-space:nowrap;overflow:hidden}
.prog-chip.fin{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}
.prog-chip b{overflow:hidden;text-overflow:ellipsis}
.prog-chip em{font-style:normal;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.fin-banner{background:linear-gradient(90deg,#ECFDF5,#F0FDF9);border:1px solid #A7F3D0;color:#065F46}
.btn.btn-finish{background:linear-gradient(135deg,#059669,#10B981)!important;border:0;color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.35)}
.ow-lim{min-width:86px}
.sday{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.sday>button{width:100%}
.sday-n{width:100%;border:1.5px solid #F59E0B;border-radius:8px;background:#FFFBEB;color:#92400E;font:inherit;font-weight:800;font-size:13.5px;text-align:center;padding:2px 0;min-height:28px}
.sday-off{text-align:center;font-size:12.5px;color:#94A3B8;min-height:28px;line-height:28px}
.scard-time .sfield:has(.skinds)>label,.scard-time .sfield:has(.sdays)>label{display:none}
.scard-time .skinds{margin-bottom:6px}
.sday-n{min-height:24px;padding:0}
.sday-off{min-height:24px;line-height:24px}
.scard-id .sfields{row-gap:2px}
.scard .input,.scard select.input{min-height:34px}
.scard-time .sgrid4{row-gap:4px}
.stoprow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:6px}
.stoprow .ssum{justify-self:start;font-size:13px;padding:3px 10px}
.stoprow .skinds{margin:0}
.sdetail{justify-self:end;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#0F766E;text-decoration:none;border:1.5px solid #99E0D6;border-radius:999px;padding:3px 10px;background:#F0FBF9}
.sbreaks .sadd{grid-column:auto;align-self:stretch;justify-self:stretch}
.cons-tg{border:1.5px solid #c9d3e3;background:#f4f7fb;color:#4a5a75;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.cons-tg.must{background:#fff1e6;border-color:#f08a3c;color:#b4520f}
.cons-tg:disabled{opacity:.6;cursor:default}
/* ---- distribution sheet (ورقة توزيع الحصص) ---- */
.ys-panel{display:flex;align-items:center;gap:16px;padding:16px 20px;margin:0 0 14px;border-radius:16px;background:linear-gradient(135deg,#1E3A6B 0%,#2F5FA8 100%);color:#fff;box-shadow:0 8px 22px rgba(30,58,107,.25)}
.ys-badge{flex:none;width:52px;height:52px;border-radius:50%;background:#FFC83D;color:#1E3A6B;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ys-txt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ys-txt b{font-size:20px}
.ys-txt span{font-size:14px;opacity:.92;line-height:1.5}
.ys-btns{display:flex;gap:8px;flex-wrap:wrap}
.ys-btns .btn{font-size:15px;padding:10px 16px}
.ys-panel .btn.btn-primary{background:#fff !important;color:#1E3A6B !important;border:0}
.modal .ys-panel{margin:0}
@media (max-width:760px){.ys-panel{flex-direction:column;text-align:center}.ys-btns{justify-content:center}}
.ys-top{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 14px;background:#FFC83D;color:#1E3A6B;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(255,200,61,.4)}
.ys-top:hover{filter:brightness(1.05)}
.ys-rev{display:flex;flex-direction:column;gap:10px}
.ys-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ys-stats div{background:#EEF3FB;border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.ys-stats b{font-size:26px;color:#1E3A6B}
.ys-stats span{font-size:13px;color:#4a5a75}
.ys-box{border:1.5px solid #dbe3f0;border-radius:12px;padding:10px 14px;background:#fff}
.ys-box ul{margin:6px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.7}
.ys-box.err{border-color:#f3b4b4;background:#fff6f6}
.ys-box.err>b{color:#B42318}
.ys-box.warn{border-color:#f5d48a;background:#fffbef}
.ys-box.warn>b{color:#8a5a00}
.ys-box.ask{border-color:#9ec5f5;background:#f3f8ff}
.ys-box.ask label{cursor:pointer}
.ys-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ys-ok{text-align:center}
.ys-ok-big{font-size:48px}
.ys-ok-l{font-size:18px;font-weight:700;color:#1E7A4C;margin:4px 0 12px}
.ys-ok-next{margin:0 0 8px}
.ys-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.ys-steps li{counter-increment:s}
.ys-steps button{width:100%;display:flex;align-items:center;gap:10px;border:1.5px solid #c9d8ee;background:#f5f9ff;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;color:#1E3A6B;cursor:pointer}
.ys-steps button::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:#1E3A6B;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ys-steps button:hover{background:#e8f1ff}
.ys-reset-name{font-size:17px;margin:0 0 8px}
.ys-reset-d{background:#fff6f6;border:1.5px solid #f3b4b4;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;margin:0 0 10px}
/* a left-over card is picked: highlight its class row */
.whole tr.w-focus td{background:#FFF6D6}
.whole tr.w-focus th.wl{background:#F5A524 !important;color:#2A1A00 !important;font-weight:800}
.whole tr.w-focus{outline:3px solid #F5A524;outline-offset:-2px}
.whole tr.w-focus td.can{background:#CDEFD9;outline:2px solid #1E7A4C;outline-offset:-2px;cursor:pointer}
.whole tr.w-focus td.cant{background:#FBE3E0}
.ucard{cursor:pointer}
.ucard.on{outline:3px solid #F5A524;outline-offset:2px;transform:translateY(-2px)}
.whole tr.w-focus td{box-shadow:inset 0 3px 0 #F5A524,inset 0 -3px 0 #F5A524}
.whole tbody:has(tr.w-focus) tr:not(.w-focus) .wcard{opacity:.28}
.whole tbody:has(tr.w-focus) tr:not(.w-focus) th.wl{opacity:.45}
.sg-box{border:2px solid #F5A524;background:#FFF8E6;border-radius:12px;padding:12px 14px}
.sg-box>b{font-size:16px;color:#7A4A00}
.sg-box p{margin:6px 0}
.sg-box ul{margin:6px 0;padding-inline-start:20px;line-height:1.9;font-size:15px}
.sg-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.crash{max-width:560px;margin:40px auto;text-align:center;background:#fff;border:2px solid #f3b4b4;border-radius:16px;padding:24px}
.crash-ic{font-size:44px}
.crash h2{margin:6px 0;color:#B42318}
.crash p{line-height:1.8}
.crash-acts{display:flex;gap:10px;justify-content:center;margin:12px 0}
</style>
