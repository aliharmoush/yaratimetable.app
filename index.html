<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YARA TIMETABLE</title>
<meta name="description" content="YARA TIMETABLE — برنامج توزيع الحصص المدرسية">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23F2A33A'/%3E%3Cg fill='none' stroke='%2312223F' stroke-width='2' stroke-linecap='round'%3E%3Crect x='4' y='5' width='16' height='15' rx='2'/%3E%3Cpath d='M4 10h16M10 10v10M15 10v10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12223F; --navy2:#1B2F55; --navy3:#26406E; --primary:#1D3A6B; --primary-d:#0F2142;
  --accent:#F2A33A; --accent-soft:#FFF8EC; --ink:#14213D; --muted:#56627A; --line:#E1E6EF; --line2:#C7CFDD;
  --bg:#F4F6FA; --card:#fff; --ok:#1E7A4C; --ok-soft:#EEF6F1; --err:#B42318; --err-soft:#FDECEA; --warn:#9A6200; --warn-soft:#FFF4DE;
  --radius:12px; --font:'IBM Plex Sans Arabic','Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary)} a:hover{color:var(--primary-d)}
h1,h2,h3{margin:0}
.latin{font-family:'Space Grotesk',system-ui,sans-serif}
[dir=rtl] .flip-rtl{transform:scaleX(-1)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-d)}
.btn-accent{background:var(--accent-soft);border:2px solid var(--accent);color:var(--navy)}
.btn-ghost{background:#fff;border-color:var(--line2);color:var(--ink)}.btn-ghost:hover{background:#F7F9FC}
.btn-danger{background:var(--err);color:#fff}
.btn-link{background:none;border:none;color:var(--primary);padding:0 4px;min-height:36px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:#EEF2F8;color:var(--ink)}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--muted)}
.field .err{font-size:13px;color:var(--err)}
.input,select.input,textarea.input{min-height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:#F7F9FC;width:100%}
textarea.input{padding:10px 14px;min-height:80px}
.input.num{width:72px;text-align:center;padding:0 6px}
.check{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{min-height:42px;padding:0 16px;border:0;background:transparent;cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* auth layout */
.auth{min-height:100vh;display:flex;flex-wrap:wrap;background:#fff}
.poster{flex:999 1 560px;min-width:0;background:var(--navy);color:#fff;padding:52px 60px;display:flex;flex-direction:column;gap:32px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:48px;height:48px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:.04em}
.brand-name span{color:var(--accent)}
.poster h1{font-size:44px;line-height:1.25;white-space:pre-line}
.poster p.lead{font-size:18px;line-height:1.8;color:#C9D3E6;margin:14px 0 0;max-width:640px}
.mini{background:var(--navy2);border-radius:16px;padding:18px;max-width:640px}
.mini-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mini-row+.mini-row{margin-top:8px}
.mini-day{font-size:13px;font-weight:600;color:#9FB0CF;text-align:center}
.mini-cell{height:34px;border-radius:8px;background:var(--navy3);color:#E6ECF7;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.mini-cell.hl{background:var(--accent);color:var(--navy);font-weight:700}
.mini-cell.empty{background:transparent;border:1px dashed #2C4270}
.feat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;max-width:640px;color:#E6ECF7}
.feat li{display:flex;align-items:center;gap:10px}
.poster-contact{border-top:1px solid #2C4270;padding-top:20px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;color:#C9D3E6}
.poster-contact a{color:#fff}
.auth-side{flex:1 1 420px;min-width:0;padding:36px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.auth-form{width:100%;max-width:440px;align-self:center;display:flex;flex-direction:column;gap:16px}
.auth-form h2{font-size:30px;color:var(--navy)}
.auth-form .sub{color:var(--muted);margin:4px 0 0}
.trust{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.6}
.trust strong{display:block;font-size:15px}
.trust.green{background:var(--ok-soft);border:1px solid #CFE6D8}
.trust.blue{background:#EEF2FA;border:1px solid #D3DCEE}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.footnote{text-align:center;font-size:13px;color:#6B7690;margin:0}
@media (max-width:720px){.poster{padding:28px 22px;gap:20px}.poster h1{font-size:30px}.mini,.feat{display:none}.auth-side{padding:24px 20px}}

/* app shell */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:60px;flex-wrap:wrap}
.topbar .brand-name{font-size:18px;color:var(--navy)}
.topbar .brand-mark{width:34px;height:34px;border-radius:9px}
.topbar .spacer{flex:1}
.crumbs{color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center}
.save-state{font-size:13px;color:var(--ok);padding:0 8px}
.body{display:flex;flex-wrap:wrap;flex:1}
.side{flex:0 0 250px;background:#fff;border-inline-end:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.side .grp{font-size:12px;font-weight:700;color:#8792A8;margin:14px 10px 4px;letter-spacing:.02em}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;min-height:42px}
.side a:hover{background:#F2F5FA}
.side a[aria-current=page]{background:#E8EEF8;color:var(--primary);font-weight:700}
.side .dis{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#9AA4B8;font-size:14px}
.side .dis small{margin-inline-start:auto;font-size:11px;border:1px solid var(--line2);border-radius:20px;padding:1px 8px}
.side-school{display:flex;align-items:center;gap:10px;padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.side-school img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#F7F9FC}
.side-school .nm{font-weight:700;font-size:14px;line-height:1.4}
.main{flex:999 1 600px;min-width:0;padding:24px 28px 80px}
@media (max-width:900px){.side{display:none}.side.open{display:flex;position:fixed;inset-block:60px 0;inset-inline-start:0;width:270px;z-index:30;box-shadow:0 10px 40px rgba(0,0,0,.2);overflow:auto}.main{padding:16px 14px 90px}}
.mob-only{display:none}@media (max-width:900px){.mob-only{display:inline-flex}.desk-only{display:none}}
.bottombar{display:none}
@media (max-width:900px){.bottombar{display:flex;position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:25;justify-content:space-around;padding:6px}.bottombar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:12px;color:var(--muted);min-height:48px;cursor:pointer}}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;margin-bottom:16px}
.banner-trial{background:var(--warn-soft);border:1px solid #F3D7A3;color:#5A3D00}
.banner-err{background:var(--err-soft);border:1px solid #F5C2BC;color:var(--err)}
.banner-ok{background:var(--ok-soft);border:1px solid #CFE6D8;color:var(--ok)}
.banner .grow{flex:1}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:26px;color:var(--navy)}
.page-head p{margin:6px 0 0;color:var(--muted)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card+.card{margin-top:16px}
.card h3{font-size:17px;margin-bottom:12px;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat .n{font-size:30px;font-weight:700;color:var(--navy)}
.stat .l{color:var(--muted);font-size:14px}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.tbl th{background:#F7F9FC;font-weight:700;color:#3F4A60;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c,.tbl th.c{text-align:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill-ok{background:var(--ok-soft);color:var(--ok)} .pill-err{background:var(--err-soft);color:var(--err)} .pill-warn{background:var(--warn-soft);color:var(--warn)} .pill-gray{background:#EEF1F6;color:#56627A}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

/* curriculum grid */
.cur td.cell{padding:4px;text-align:center}
.cur input{width:52px;min-height:38px;text-align:center;border:1px solid var(--line2);border-radius:8px;background:#fff}
.cur input.chg{background:var(--warn-soft);border-color:#E9C46A}
.cur tfoot td{font-weight:700;background:#F7F9FC;text-align:center}
.cur .sticky{position:sticky;inset-inline-start:0;background:#fff;z-index:1}

/* grades */
.grade-card{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.grade-card:last-child{border-bottom:0}
.grade-card .gname{min-width:190px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:4px 6px 4px 12px;background:#F7F9FC;font-size:14px}
[dir=rtl] .chip{padding:4px 12px 4px 6px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%}
.chip button:hover{background:#E6EBF3}

/* periods */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.day.off{background:#F7F9FC;opacity:.75}
.day h4{margin:0 0 8px;font-size:15px}
.stepper{display:flex;align-items:center;gap:8px;margin:8px 0}
.stepper b{min-width:28px;text-align:center;font-size:20px}
.plist{font-size:12px;color:var(--muted);line-height:1.8}
.plist .brk{color:var(--warn)}

/* modal */
.modal-back{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(18,34,63,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-wide{max-width:780px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:18px}
.modal-body{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.toasts{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200}
[dir=rtl] .toasts{transform:translateX(50%)}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px}
.toast-err{background:var(--err)}

.reckey{font-family:'Space Grotesk',monospace;font-size:20px;letter-spacing:.06em;background:#F7F9FC;border:2px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;direction:ltr;user-select:all;word-break:break-all}
.center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.center-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.center-card h2{color:var(--navy)}
.logo-box{width:120px;height:120px;border:2px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;background:#F7F9FC;overflow:hidden}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field .seg{display:flex;width:100%}
.field .seg button{flex:1}
/* compact setup form */
.center-card-setup{max-width:620px;padding:24px 28px;gap:14px}
.setup-head h2{font-size:24px}
.setup-head p{margin:4px 0 0;font-size:14px}
.setup-form{display:flex;flex-direction:column;gap:12px}
.setup-sec{border:1px solid var(--line);border-radius:12px;padding:12px 16px 16px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.setup-sec legend{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--navy);padding:0 6px}
.setup-sec .num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.setup-sec .grid2{gap:12px}
.setup-sec .field label{font-size:13px}
.setup-sec .input{min-height:42px}
.setup-sec .seg button{min-height:40px;font-size:14px}
.seg-full{display:flex;width:100%}.seg-full button{flex:1}
.check-row{display:flex;gap:16px;flex-wrap:wrap;min-height:42px;align-items:center}
.hint-line{margin:0;font-size:13px;color:var(--muted)}
.btn-block{width:100%;min-height:48px;font-size:16px}
.banner-info{background:#EAF1FB;color:#12223F;border:1px solid #C9D9F0}
/* ===== compact app (fit without scrolling) ===== */
.shell{font-size:14px}
.shell .topbar{min-height:50px;padding:5px 14px}
.shell .icon-btn{width:34px;height:34px}
.icon-btn.sm{width:28px;height:28px;border-radius:7px}
.shell .btn{min-height:36px;padding:0 14px;border-radius:8px;font-size:14px}
.shell .btn-sm{min-height:32px;padding:0 11px;font-size:13px;gap:6px}
.shell .input,.shell select.input{min-height:36px;padding:0 10px;border-radius:8px}
.shell .input.num{width:64px}
.shell .field{gap:4px}
.shell .field label{font-size:12.5px}
.shell .seg button{min-height:34px;padding:0 12px;font-size:13px}
.shell .check{min-height:30px}
.shell .side{flex:0 0 210px;padding:10px 8px}
.shell .side a{padding:7px 10px;min-height:34px;font-size:14px}
.shell .side .grp{margin:10px 8px 2px;font-size:11px}
.shell .side .dis{padding:6px 10px;font-size:13px}
.shell .main{padding:14px 18px 60px}
.shell .banner{padding:7px 12px;margin-bottom:10px;border-radius:10px;font-size:13px}
.shell .page-head{margin-bottom:10px;align-items:center}
.shell .page-head h1{font-size:20px}
.shell .page-head p{margin:2px 0 0;font-size:12.5px}
.shell .card{padding:14px;border-radius:10px}
.shell .card+.card{margin-top:10px}
.shell .card h3{font-size:15px;margin-bottom:8px}
.shell .grid2{gap:10px}
.shell .stats{gap:10px;margin-bottom:10px}
.shell .stat{padding:10px 14px}.shell .stat .n{font-size:24px}
.shell table.tbl{font-size:13px}
.shell .tbl th,.shell .tbl td{padding:6px 10px}
.card-tight{padding:12px 14px}
.sm{font-size:12px}
.grow{flex:1;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.input-sm{min-height:32px!important}
/* toolbar + selectable tables */
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:8px}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tb-hint{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.tbl-sel tbody tr{cursor:pointer}
.tbl-sel tbody tr:hover{background:#F7F9FC}
.tbl-sel tbody tr.on{background:#E8EEF8}
.w-chk{width:38px}
.tbl-sel input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.shell .pill{padding:1px 8px;font-size:11.5px}
/* school settings */
.settings-card{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.settings-logo{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.settings-logo .logo-box{width:96px;height:96px}
/* periods */
.pset{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:var(--muted)}
.daypick button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.ptotal{display:flex;flex-direction:column;align-items:center;margin-inline-start:auto;padding:2px 12px;border-radius:8px;background:var(--accent-soft);border:1px solid #F3D7A3}
.ptotal span{font-size:11px;color:var(--muted)}.ptotal b{font-size:20px;color:#D35400}
.shell .days{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.shell .day{padding:8px 10px;border-radius:10px}
.day-head{display:flex;justify-content:space-between;align-items:center}
.shell .day h4{margin:0;font-size:14px}
.shell .stepper{margin:4px 0;gap:4px}.shell .stepper b{font-size:17px;min-width:22px}
.shell .plist{display:block;width:100%;border:0;background:none;padding:4px 0 0;cursor:pointer;text-align:start;font-size:12px;line-height:1.75;border-top:1px dashed var(--line)}
.plist>div{display:flex;justify-content:space-between;gap:6px}
.plist>div:hover{color:var(--primary)}
.plist .custom-tag{display:block;font-size:10.5px;color:var(--primary);margin-top:2px}
.times-tbl .input{min-height:32px}
.times-tbl .brk-row td{background:var(--warn-soft)}
.per-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 12px}
.per-item{display:flex;align-items:center;gap:8px;font-size:13px;border-bottom:1px dashed var(--line);padding:2px 0}
.per-item .input.num{width:56px;min-height:30px}
.side-logout{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-top:1px solid var(--line);background:none;color:var(--err);font-weight:600;cursor:pointer;text-align:start}
.side-logout:hover{background:var(--err-soft)}
.xl-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:10px}
.xl-step{display:flex;align-items:flex-start;gap:10px;margin:0!important}
.xl-step h3{margin:0 0 2px}.xl-step p{margin:0}
.xl-num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.xl-step .btn{align-self:center}
.xl-prev{display:flex;flex-direction:column;gap:10px}
/* assign */
.as-wrap{display:flex;gap:10px;align-items:flex-start}
.as-grades{flex:0 0 130px;display:flex;flex-direction:column;gap:3px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px}
.as-grades button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:6px 8px;border-radius:7px;cursor:pointer;text-align:start;font-size:13px}
.as-grades button:hover{background:#F2F5FA}
.as-grades button[aria-pressed=true]{background:var(--primary);color:#fff;font-weight:600}
.as-grades .ok{color:var(--ok);font-weight:700}.as-grades button[aria-pressed=true] .ok{color:#fff}
.shell .as-sel{min-height:30px;padding:0 6px;font-size:13px;min-width:140px}
.as-sel.empty{background:#FFF8EC;border-color:#F3D7A3}
.as-sel.chg{background:#EAF1FB;border-color:#9FB6DC}
.as-sel.over{border-color:var(--err);color:var(--err)}
.as-sel.all{background:#fff;border-style:dashed;color:var(--muted)}
.as-load{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px;font-size:13px}
@media (max-width:700px){.as-wrap{flex-direction:column}.as-grades{flex-direction:row;flex-wrap:wrap;flex-basis:auto;width:100%}}
/* timetable */
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress div{height:100%;background:var(--accent);transition:width .2s}
.tt-empty{display:flex;align-items:center;gap:14px}
.tt-empty h3{margin:0 0 2px}
.tt-grid{table-layout:fixed}
.tt-grid th.tt-num{width:56px;background:#F7F9FC;font-size:11px;color:var(--muted)}
.tt-grid th.tt-num b{display:block;font-size:14px;color:var(--ink)}
.shell .tt-grid td.tt-cell{padding:3px;height:46px;vertical-align:top}
.tt-off{background:repeating-linear-gradient(45deg,#F4F6FA,#F4F6FA 6px,#EDF0F5 6px,#EDF0F5 12px)}
.tt-item{border-inline-start:4px solid;border-radius:6px;padding:3px 6px;display:flex;flex-direction:column;line-height:1.3;height:100%}
.tt-item b{font-size:12.5px}.tt-item span{font-size:11px;color:var(--muted)}
/* time off grid */
.to-grid{border-collapse:separate;border-spacing:4px;margin:0 auto}
.to-grid th button{border:0;background:#F2F5FA;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:13px;min-width:44px;width:100%}
.to-grid th button:hover{background:#E3E9F3}
.to-grid td{padding:0}
.to-grid td button{width:54px;height:44px;border-radius:8px;border:1px dashed var(--line2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.to-grid td button.on{background:var(--ok-soft);color:var(--ok)}
.to-grid td button.off{background:var(--err-soft);color:var(--err);border-style:solid;border-color:#F5C2BC}
.to-grid td.none{background:#F4F6FA;border-radius:8px}
.to-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.to-legend>span{display:inline-flex;align-items:center;gap:5px}
.to-legend .lg{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
.to-legend .lg.on{background:var(--ok-soft);color:var(--ok)}.to-legend .lg.off{background:var(--err-soft);color:var(--err)}
@media (max-width:600px){.to-grid td button{width:38px;height:36px}}
/* whole-school grid (aSc style) */
.whole-wrap{overflow:auto}
table.whole{border-collapse:collapse;font-size:11px;min-width:100%}
.whole th,.whole td{border:1px solid var(--line);padding:0;text-align:center}
.whole th.wd{background:#E8EEF8;font-weight:700;padding:3px;font-size:12px;border-inline-start:2px solid var(--line2)}
.whole th.wn{background:#F7F9FC;color:var(--muted);font-weight:600;padding:2px;min-width:30px}
.whole th.wl{position:sticky;inset-inline-start:0;z-index:2;background:#F7F9FC;font-weight:700;padding:0 6px;white-space:nowrap;font-size:12px}
.whole .dayend{border-inline-end:2px solid var(--line2)}
.whole td.wc{height:26px;min-width:32px;background:#fff}
.whole td.off{background:#F4F6FA;color:#B0B8C8;font-size:11px}
.whole td.none{background:#EDF0F5}
.whole td.can{background:#E3F4EA;outline:1px dashed var(--ok)}
.whole td.cant{background:#FBECEA}
.wcard{color:#fff;font-weight:700;height:100%;min-height:24px;display:flex;align-items:center;justify-content:center;cursor:grab;text-shadow:0 1px 1px rgba(0,0,0,.35);padding:0 2px;white-space:nowrap;overflow:hidden}
.wcard:active{cursor:grabbing}
.cards{margin-top:10px;background:#5F6B85;border-radius:10px;padding:8px 10px;color:#fff;min-height:70px}
.cards.target{outline:2px dashed var(--accent)}
.cards-head{display:flex;gap:8px;align-items:center;margin-bottom:6px}.cards-head .muted{color:#D6DCE8}
.cards-list{display:flex;flex-wrap:wrap;gap:5px}
.ucard{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:6px;overflow:hidden;cursor:grab;box-shadow:2px 2px 0 rgba(0,0,0,.25);min-width:58px}
.ucard span{color:#fff;font-weight:700;font-size:12px;padding:3px 8px;width:100%;text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.ucard small{color:var(--ink);font-size:10.5px;padding:1px 4px}
/* test + generate dialogs */
.test-list{display:flex;flex-direction:column;gap:6px}
.test-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:13.5px}
.test-row.ok{background:var(--ok-soft);color:var(--ok)}.test-row.ok .muted{color:var(--ok)}
.test-row.warn{background:var(--warn-soft);color:#5A3D00}
.test-row.bad{background:var(--err-soft);color:var(--err)}
.gen-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.gen-opts b{display:block;margin-bottom:6px}
@media (max-width:600px){.gen-opts{grid-template-columns:1fr}}
.res-big{display:flex;gap:14px;align-items:center;padding:14px;border-radius:10px}
.res-big.ok{background:var(--ok-soft);color:var(--ok)}.res-big.warn{background:var(--warn-soft);color:#5A3D00}
.res-big b{font-size:24px}
.res-tbl{width:100%;font-size:13.5px;border-collapse:collapse}
.res-tbl td{padding:5px 4px;border-bottom:1px solid var(--line)}
.res-tbl td:last-child{text-align:end;font-weight:600}
/* reports */
.rp-pages{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.rpage{background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06);padding:10mm;position:relative;overflow:hidden;display:grid;gap:8mm;aspect-ratio:297/210;max-width:1100px;width:100%;margin:0 auto}
.per-2 .rpage{aspect-ratio:210/297;max-width:780px;grid-template-rows:1fr 1fr}
.per-4 .rpage{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6mm}
.rbox{display:flex;flex-direction:column;min-height:0;min-width:0}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.rhead img{height:34px;width:34px;object-fit:contain}
.rhead span{min-width:34px}
.rtitle{text-align:center;flex:1}.rtitle small{display:block;font-size:10px;color:#56627A}.rtitle b{font-size:17px;color:#000}
.per-4 .rtitle b{font-size:14px}
.rshift{font-size:10px;color:#56627A;text-align:end}
.rtbl{width:100%;flex:1;border-collapse:collapse;table-layout:fixed;font-size:12px;color:#000}
.rtbl th,.rtbl td{border:1.4px solid #222;text-align:center;vertical-align:middle;padding:1px 2px}
.rtbl thead th{background:#F1F3F7;font-weight:700;height:22px}
.rtbl tbody th{width:52px;background:#FAFBFD}
.rtbl tbody th b{display:block;font-size:16px}.rtbl tbody th small{font-size:8.5px;color:#444}
.rtbl td .m{display:block;font-weight:700;border-bottom:3px solid transparent;line-height:1.25}
.rtbl td small{display:block;font-size:9.5px;color:#333;line-height:1.2}
.per-4 .rtbl{font-size:10.5px}.per-4 .rtbl td small{font-size:8.5px}.per-4 .rtbl tbody th{width:42px}.per-4 .rtbl tbody th b{font-size:13px}
.rtbl td.x{background:#EEF0F4}
.rfoot{display:flex;justify-content:space-between;font-size:8.5px;color:#555;margin-top:2px}
.trial .rpage::after{content:'';position:absolute;top:50%;right:0;bottom:0;left:0;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);background:rgba(255,255,255,.35)}
.trial-veil{position:absolute;top:50%;right:0;bottom:0;left:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--navy);text-align:center;padding:10px}
.trial-veil b{font-size:18px}
@media print{
  .topbar,.side,.bottombar,.banner,.no-print,.toasts{display:none!important}
  html,body,.shell,.body,.main{background:#fff!important;padding:0!important;margin:0!important;display:block!important}
  .rp-pages{gap:0;margin:0}
  .rpage{border:0;box-shadow:none;padding:0;max-width:none;width:100%;height:calc(100vh - 1mm);aspect-ratio:auto;page-break-after:always;break-after:page}
  .trial .rpage{display:none}
  .trial::before{content:'YARA TIMETABLE — Printing is available for subscribers only / الطباعة للمشتركين فقط';display:block;font-size:20px;padding:40px;text-align:center}
}
.btn-next{background:var(--ok)!important;gap:8px}.btn-next:hover{background:#17603B!important}
.gd-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.gd-day{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.gd-mini{display:inline-flex;gap:3px}
.gd-mini span{display:flex;flex-direction:column;align-items:center;min-width:26px;border:1px solid var(--line);border-radius:5px;font-weight:700;font-size:12px;line-height:1.2;padding:1px 2px}
.gd-mini small{font-size:9px;font-weight:400;color:var(--muted)}
.picker{margin-bottom:8px}
.picker-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.picker-toggle{display:inline-flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:2px 0;font-size:14px;color:var(--navy)}
.picker-grp{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-top:1px dashed var(--line)}
.picker-gname{flex:0 0 110px;border:0;background:#F2F5FA;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:700;cursor:pointer;text-align:start}
.picker-items{display:flex;flex-wrap:wrap;gap:5px}
.pk{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:20px;padding:3px 10px 3px 8px;font-size:13px;cursor:pointer;background:#fff}
.pk.on{background:#E8EEF8;border-color:var(--primary);color:var(--primary);font-weight:600}
.pk input{accent-color:var(--primary)}
.pg-grid th button small{display:block;font-size:9.5px;font-weight:500;color:var(--muted);margin-top:1px}
.pg-grid thead th button{min-width:62px}
.pg-grid tbody th button{min-width:86px;text-align:start}
.pg-grid tbody th button[aria-pressed=true]{background:var(--primary);color:#fff}
.pg-grid tr.pg-off td button.off{opacity:.45}
.pg-grid .pg-cnt{text-align:center;font-size:12px;color:var(--muted);min-width:50px}
.pg-grid td.pg-cnt b{font-size:16px;color:var(--ink)}
.pg-custom{color:var(--primary);background:#E8EEF8}
.linkname{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--primary);cursor:pointer;text-align:start;text-decoration:underline dotted;text-underline-offset:3px}
.linkname:hover{color:var(--primary-d);text-decoration-style:solid}
.dt-sum{display:flex;gap:10px;flex-wrap:wrap}
.dt-sum>div{flex:1;min-width:110px;background:#F2F5FA;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.dt-sum b{font-size:22px;color:var(--navy)}.dt-sum span{font-size:12px;color:var(--muted)}
.dt-tbl td,.dt-tbl th{font-size:13px}
.ucard.pre{cursor:default}
.print-title{display:none}
@media print{
  .no-print{display:none!important}
  .print-title{display:block;font-weight:700;font-size:16px;text-align:center;margin-bottom:6px}
  .whole-wrap,.tbl-wrap{overflow:visible!important;border:0}
  table.whole{font-size:7.5px;width:100%;table-layout:fixed}
  .whole th.wl{width:34px}
  .whole td.wc{height:18px;min-width:0}
  .wcard{min-height:16px;font-size:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tt-item{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.wcard{position:relative}
.wcard .pin{position:absolute;top:-3px;inset-inline-end:-2px;font-size:9px;text-shadow:none}
/* special reports */
.rpage-sheet{aspect-ratio:auto!important;min-height:auto}
.rmaster{font-size:9px}.rmaster th.n{font-size:8px;font-weight:600}.rmaster td{padding:0;height:18px}.rmaster td.de{border-inline-end:2.5px solid #222}
.rmaster th.nm,.rlist th.nm{text-align:start;white-space:nowrap;padding:2px 6px;font-size:11px}
.rlist td{padding:4px 6px;font-size:11.5px}.rlist td small{color:#555}
.rlist .gapx{color:#B42318;font-size:10px}.rlist .offday{color:#888;font-size:10px}
.rlist .sign-row td,.rlist .sign-row th{height:34px}.rlist td.subs{font-size:10.5px;text-align:start}
/* daily cover */
.sb-top{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.pk.abs{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.sb-sheet{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.sb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sb-head img{height:40px}.sb-head>div{text-align:center;display:flex;flex-direction:column}
.sb-head small{color:var(--muted)}.sb-head b{font-size:18px;color:var(--navy)}
.sb-tbl .as-sel{min-width:260px}
.sb-foot{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:#444}
.print-only{display:none}
@media print{
  .print-only{display:table-cell}
  span.print-only{display:inline}
  .sb-sheet{border:0;padding:0}
  .sb-tbl{font-size:12px}.sb-tbl td,.sb-tbl th{border:1.2px solid #222!important}
  .sb-sign{min-width:110px}
}
.ow-stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ow-stat{cursor:pointer;text-align:start;font:inherit}
.ow-stat.on{border-color:var(--primary);background:#E8EEF8}
.ow-stat.warn .n{color:var(--err)}
.ow-wa{color:#128C7E}
.xl-backup{margin-bottom:10px!important;background:var(--ok-soft);border-color:#CFE6D8}
.demo-btn{min-height:46px;border-style:dashed}
.demo-banner{background:#EEF2FA;border-color:#C9D9F0}
.xl-hero{background:#fff;border:2px solid var(--primary);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.xl-hero-t{display:flex;flex-direction:column;margin-bottom:8px}.xl-hero-t b{font-size:18px;color:var(--navy)}.xl-hero-t span{color:var(--muted);font-size:13px}
.xl-hero ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;counter-reset:s}
.xl-hero li{counter-increment:s;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:#F7F9FC;border-radius:10px;padding:10px 12px}
.xl-hero li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center}
.xl-adv{margin-bottom:10px}.xl-adv summary{cursor:pointer;color:var(--primary);font-size:13px;margin:4px 0 8px}
/* bigger, clearer sidebar */
.shell .side{flex:0 0 250px;padding:12px 10px}
.shell .side a{padding:10px 14px;min-height:44px;font-size:16.5px;font-weight:600;gap:10px}
.shell .side a svg{width:20px;height:20px}
.shell .side .grp{margin:14px 10px 4px;font-size:12.5px;font-weight:700}
/* big red generate */
.btn.btn-generate{background:#D92D20;border-color:#D92D20;color:#fff;font-size:17px;font-weight:800;padding:10px 22px;min-height:46px;border-radius:10px;box-shadow:0 4px 12px rgba(217,45,32,.3)}
.btn.btn-generate:hover:not(:disabled){background:#B42318;border-color:#B42318}
.btn.btn-generate svg{width:22px;height:22px}
/* reports */
.rp-kind{display:flex;align-items:center;gap:8px;font-weight:700}
.rp-kind select{min-width:220px;font-size:15px;font-weight:600;padding:8px 10px;height:auto}
.banner-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #F3D9A4}
.per-4 .rtbl td{overflow:hidden}
.per-4 .rtbl td .m,.per-4 .rtbl td small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.rp-kind span{white-space:nowrap}
/* dashboard cards */
.dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.dstat{display:flex;align-items:center;gap:14px;border:0;border-radius:14px;padding:16px 18px;cursor:pointer;color:#fff;font:inherit;text-align:start;box-shadow:0 3px 10px rgba(16,24,40,.1);transition:transform .1s}
.dstat:hover{transform:translateY(-2px)}
.dstat.on{outline:3px solid rgba(16,24,40,.25)}
.dstat-grades{background:linear-gradient(135deg,#1D3A6B,#2F5DA8)}
.dstat-subjects{background:linear-gradient(135deg,#1E7A4C,#2FA36A)}
.dstat-teachers{background:linear-gradient(135deg,#C2410C,#F08A24)}
.dstat .dic{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.dstat .dn{font-size:38px;font-weight:800;line-height:1}
.dstat .dl{flex:1;display:flex;flex-direction:column;font-size:20px;font-weight:800}
.dstat .dl small{font-size:14px;font-weight:600;opacity:.9}
.dstat .dch{font-size:14px;opacity:.85}
.dlist{border-top:5px solid var(--navy)}
.dlist-subjects{border-top-color:#1E7A4C}.dlist-teachers{border-top-color:#F08A24}.dlist-grades{border-top-color:#2F5DA8}
.dlist-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.dlist-head b{font-size:18px}
.dlist ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px}
.dlist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#FAFBFD;min-height:46px}
.dlist .dname{font-size:16px;font-weight:700}
.dlist li small{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist .dsecs{flex:1;display:flex;gap:4px;flex-wrap:wrap}
.dacts{display:flex;gap:4px;margin-inline-start:auto}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy)}
.ib:hover{background:#EEF2F8}.ib-del{color:#B42318}.ib-del:hover{background:#FDECEA}

/* ================= THEME 2.0 — "magic touch" ================= */
:root{--brand1:#0E1F3D;--brand2:#1E3F7A;--amber:#F5A524;--amber2:#FFB84D;--sh1:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06);--sh2:0 8px 28px rgba(16,24,40,.10);--head:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif}
html,body{background:#EEF2F8}
.shell{background:radial-gradient(1200px 500px at 85% -10%,rgba(245,165,36,.10),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(30,63,122,.10),transparent 60%),#F1F4F9;min-height:100vh}
h1,h2,h3,.page-head h1,.dlist-head b,.dstat .dl{font-family:var(--head)}

/* top bar — glass */
.shell .topbar{background:rgba(255,255,255,.78);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid rgba(225,230,239,.8);box-shadow:0 1px 0 rgba(255,255,255,.6),0 4px 18px rgba(16,24,40,.05);min-height:58px}
.topbar .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.02em;font-size:19px}
.topbar .brand-name span{color:var(--amber)}
.crumbs strong{color:var(--brand2)}

/* sidebar — deep navy */
.shell .side{flex:0 0 258px;background:linear-gradient(180deg,#0E1F3D 0%,#14295100 0%),linear-gradient(180deg,#0E1F3D,#17305C 60%,#1B3767);border:0;padding:14px 12px;color:#DCE4F2;box-shadow:inset -1px 0 0 rgba(255,255,255,.04)}
.shell .side-school{border-bottom:1px solid rgba(255,255,255,.1);padding:10px 8px 14px;margin-bottom:8px}
.shell .side-school img{background:#fff;width:46px;height:46px;border-radius:12px;padding:3px}
.shell .side-school .nm{color:#fff;font-family:var(--head);font-size:15px}
.shell .side-school svg{color:var(--amber)}
.shell .side .grp{color:#7F93B8;font-size:12px;letter-spacing:.06em;margin:16px 10px 6px;text-transform:uppercase}
.shell .side a.nv{color:#DCE4F2;padding:8px 10px;min-height:46px;font-size:16px;font-weight:600;border-radius:12px;gap:12px;transition:background .15s,transform .1s}
.shell .side a.nv:hover{background:rgba(255,255,255,.07);color:#fff}
.shell .side a.nv[aria-current=page]{background:linear-gradient(90deg,rgba(245,165,36,.22),rgba(245,165,36,.06));color:#fff;box-shadow:inset 0 0 0 1px rgba(245,165,36,.35)}
[dir=rtl] .shell .side a.nv[aria-current=page]{background:linear-gradient(270deg,rgba(245,165,36,.22),rgba(245,165,36,.06))}
.nvi{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#fff}
.nv-dashboard .nvi{background:linear-gradient(135deg,#6366F1,#8B5CF6)}
.nv-settings .nvi{background:linear-gradient(135deg,#0EA5E9,#38BDF8)}
.nv-periods .nvi{background:linear-gradient(135deg,#14B8A6,#2DD4BF)}
.nv-grades .nvi{background:linear-gradient(135deg,#2563EB,#3B82F6)}
.nv-subjects .nvi{background:linear-gradient(135deg,#16A34A,#22C55E)}
.nv-teachers .nvi{background:linear-gradient(135deg,#EA580C,#FB923C)}
.nv-excel .nvi{background:linear-gradient(135deg,#15803D,#4ADE80)}
.nv-assign .nvi{background:linear-gradient(135deg,#DB2777,#F472B6)}
.nv-timetable .nvi{background:linear-gradient(135deg,#DC2626,#F87171)}
.nv-reports .nvi{background:linear-gradient(135deg,#7C3AED,#A78BFA)}
.nv-subs .nvi{background:linear-gradient(135deg,#CA8A04,#FACC15)}
.nv-owner .nvi{background:linear-gradient(135deg,#475569,#94A3B8)}
.shell .side-logout{color:#FCA5A5!important;border-top:1px solid rgba(255,255,255,.1)!important}
.shell .side-logout:hover{background:rgba(239,68,68,.12)!important}
@media (max-width:900px){.shell .side.open{background:linear-gradient(180deg,#0E1F3D,#1B3767)}}

/* page header */
.shell .main{padding:22px 26px 70px}
.shell .page-head{margin-bottom:16px;padding-inline-start:14px;position:relative}
.shell .page-head::before{content:"";position:absolute;inset-inline-start:0;top:4px;bottom:4px;width:5px;border-radius:4px;background:linear-gradient(180deg,var(--amber),#EF4444)}
.shell .page-head h1{font-size:27px;font-weight:800;color:var(--brand1);line-height:1.3}
.shell .page-head p{font-size:14px;color:#5B6B87;margin-top:2px}

/* cards & surfaces */
.shell .card,.shell .toolbar,.shell .tbl-wrap{border:1px solid rgba(225,230,239,.9);box-shadow:var(--sh1);border-radius:16px}
.shell .card{padding:18px}
.shell .card h3{font-size:17px;font-weight:700;color:var(--brand1)}
.shell .toolbar{padding:8px 10px;border-radius:14px}
.shell .modal{border-radius:20px;box-shadow:0 30px 80px rgba(14,31,61,.35)}
.shell .modal-head h2,.modal h2{font-family:var(--head);font-weight:800}

/* buttons */
.shell .btn{border-radius:11px;font-weight:700;min-height:38px;transition:transform .08s,box-shadow .15s,background .15s}
.shell .btn:active:not(:disabled){transform:translateY(1px)}
.shell .btn-primary{background:linear-gradient(135deg,#1E3F7A,#2C5BB0);box-shadow:0 4px 12px rgba(30,63,122,.28)}
.shell .btn-primary:hover{background:linear-gradient(135deg,#17325F,#244C96)}
.shell .btn-accent{background:linear-gradient(135deg,#FFB84D,#F5A524);border:0;color:#2A1A00;box-shadow:0 4px 12px rgba(245,165,36,.35)}
.shell .btn-ghost{background:#fff;border-color:#D8DFEB;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.shell .btn-ghost:hover{background:#F5F8FD;border-color:#BCC8DC}
.shell .btn-danger{background:linear-gradient(135deg,#DC2626,#EF4444);box-shadow:0 4px 12px rgba(220,38,38,.28)}
.shell .btn.btn-generate{background:linear-gradient(135deg,#DC2626,#F43F5E);border:0;font-size:18px;min-height:50px;padding:0 26px;border-radius:14px;box-shadow:0 8px 22px rgba(220,38,38,.38);animation:gpulse 2.6s ease-in-out infinite}
@keyframes gpulse{0%,100%{box-shadow:0 8px 22px rgba(220,38,38,.38)}50%{box-shadow:0 8px 30px rgba(220,38,38,.6)}}

/* inputs & segmented */
.shell .input,.shell select.input{background:#fff;border-color:#D3DBE8;border-radius:10px;transition:border .15s,box-shadow .15s}
.shell .input:focus,.shell select.input:focus{border-color:#2C5BB0;box-shadow:0 0 0 4px rgba(44,91,176,.14);outline:none}
.shell .seg{border-radius:11px;border-color:#D3DBE8;background:#F3F6FB;padding:3px;gap:2px}
.shell .seg button{border-radius:8px;min-height:32px}
.shell .seg button[aria-pressed=true]{background:#fff;color:var(--brand2);box-shadow:0 1px 4px rgba(16,24,40,.15)}
.topbar .seg button[aria-pressed=true]{background:var(--brand2);color:#fff}

/* tables */
.shell .tbl th{background:linear-gradient(180deg,#F5F8FD,#EDF2FA);color:#24365C;font-weight:700}
.shell .tbl tbody tr:nth-child(even) td{background:#FAFBFE}
.shell .tbl tbody tr:hover td{background:#F0F5FF}

/* pills & banners */
.shell .pill{border-radius:999px;font-weight:700}
.shell .banner{border-radius:14px;box-shadow:var(--sh1)}
.shell .banner-info{background:linear-gradient(90deg,#EAF2FF,#F4F8FF);border-color:#CFE0FA}

/* dashboard cards — more depth */
.dstat{border-radius:18px;box-shadow:0 10px 26px rgba(16,24,40,.14);position:relative;overflow:hidden}
.dstat::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.09);inset-inline-end:-40px;top:-60px}
.dstat-grades{background:linear-gradient(135deg,#1E3A8A,#3B82F6)}
.dstat-subjects{background:linear-gradient(135deg,#047857,#10B981)}
.dstat-teachers{background:linear-gradient(135deg,#C2410C,#FB923C)}
.dlist{border-radius:16px}
.dlist li{background:#fff;transition:box-shadow .15s,border-color .15s}
.dlist li:hover{border-color:#C7D4EA;box-shadow:var(--sh1)}

/* excel hero */
.xl-hero{border:0;background:linear-gradient(135deg,#ffffff,#F3F7FF);box-shadow:var(--sh2);border-radius:18px;position:relative;overflow:hidden}
.xl-hero::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:linear-gradient(180deg,#22C55E,#15803D)}
.xl-hero li{background:#fff;border:1px solid #E3E9F3;box-shadow:var(--sh1)}
.xl-hero li::before{background:linear-gradient(135deg,#FFB84D,#F5A524);color:#2A1A00}

/* mobile bottom bar */
.bottombar{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.shell .side-school svg{stroke:var(--amber)!important}
/* dashboard cards v3: label on top, number under */
.dstat{align-items:center;padding:18px 20px}
.dstat .dl{font-size:24px;font-weight:800;gap:2px;line-height:1.35}
.dstat .dn{display:flex;align-items:baseline;gap:10px;font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;line-height:1.1}
.dstat .dn small{font-family:var(--head);font-size:16px;font-weight:700;opacity:.92}
.dstat .dic{width:56px;height:56px;border-radius:14px}
.dlist .dname{font-size:18px}
.dlist li{min-height:54px;padding:9px 12px}
.dlist li small{font-size:14px}
.dlist .pill{font-size:14px;padding:2px 10px}
.dlist-head b{font-size:21px}
.dlist ul{display:block;columns:3 300px;column-gap:8px}
.dlist li{break-inside:avoid;margin-bottom:6px}
/* dashboard list: one vertical column */
.dlist ul{columns:auto;display:flex;flex-direction:column;gap:6px;max-width:760px}
.dlist li{margin-bottom:0}
/* dashboard: each list drops under its own card */
.dstats{align-items:start}
.dcol{display:flex;flex-direction:column;gap:0;min-width:0}
.dcol .dstat{width:100%}
.dcol .dstat.on{border-end-start-radius:6px;border-end-end-radius:6px;outline:0}
.dcol .dlist{background:#fff;border:1px solid #E1E6EF;border-top:5px solid;border-radius:0 0 16px 16px;margin:0 8px;padding:12px;box-shadow:var(--sh2);animation:dropin .18s ease-out}
.dcol .dlist-grades{border-top-color:#3B82F6}.dcol .dlist-subjects{border-top-color:#10B981}.dcol .dlist-teachers{border-top-color:#FB923C}
@keyframes dropin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dcol .dlist ul{max-width:none}
.dcol .dlist li{min-height:48px}
.dcol .dlist .dname{font-size:17px}
.dadd{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;margin-bottom:10px;border:2px dashed;border-radius:12px;background:transparent;font:inherit;font-family:var(--head);font-size:19px;font-weight:800;cursor:pointer}
.dlist-grades .dadd{color:#1E3A8A;border-color:#93B4F5;background:#F2F6FF}
.dlist-subjects .dadd{color:#047857;border-color:#86DDB9;background:#EFFBF5}
.dlist-teachers .dadd{color:#C2410C;border-color:#FDC08C;background:#FFF6EE}
.dadd:hover{filter:brightness(.97)}
.dmore{display:block;text-align:center;margin-top:8px;font-size:14px;font-weight:600;text-decoration:none}
/* dashboard hub — stages */
.dstage{margin-bottom:18px}
.dst-h{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:var(--brand1);margin:4px 2px 10px}
.dst-n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FFB84D,#F5A524);color:#2A1A00;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:16px}
.dstats{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.dstat-settings{background:linear-gradient(135deg,#0369A1,#38BDF8)}
.dstat-periods{background:linear-gradient(135deg,#0F766E,#2DD4BF)}
.dstat-assign{background:linear-gradient(135deg,#BE185D,#F472B6)}
.dstat-timetable{background:linear-gradient(135deg,#B91C1C,#F87171)}
.dstat-reports{background:linear-gradient(135deg,#6D28D9,#A78BFA)}
.dstat-subs{background:linear-gradient(135deg,#A16207,#FACC15)}
.dcol .dlist-settings{border-top-color:#38BDF8}.dcol .dlist-periods{border-top-color:#2DD4BF}.dcol .dlist-assign{border-top-color:#F472B6}
.dcol .dlist-timetable{border-top-color:#F87171}.dcol .dlist-reports{border-top-color:#A78BFA}.dcol .dlist-subs{border-top-color:#FACC15}
.dch{display:flex;align-items:center;gap:8px}
.dok,.dbad{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.dok{background:#fff;color:#16A34A}.dbad{background:#FEF3C7;color:#B45309}
.dcol{position:relative}
.is-next .dstat{box-shadow:0 0 0 4px #FFD27A,0 10px 26px rgba(16,24,40,.18);animation:nextglow 2s ease-in-out infinite}
@keyframes nextglow{0%,100%{box-shadow:0 0 0 3px #FFD27A,0 10px 26px rgba(16,24,40,.16)}50%{box-shadow:0 0 0 6px #FFC94D,0 10px 26px rgba(16,24,40,.2)}}
.dnext{position:absolute;top:-11px;inset-inline-start:16px;z-index:2;background:#FFB84D;color:#2A1A00;font-size:12.5px;font-weight:800;border-radius:20px;padding:2px 12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.dwarnbar{margin:0 10px;border:1px solid #F7D9A0;border-top:0;background:#FFF8E6;color:#92400E;font:inherit;font-weight:700;font-size:14px;text-align:start;padding:7px 12px;border-radius:0 0 12px 12px;cursor:pointer}
.dwarn{background:#FFF8E6;color:#92400E;border:1px solid #F7D9A0;border-radius:10px;padding:8px 12px;font-weight:700;margin:0 0 10px}
.dbody ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dgo{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;margin-top:8px;border-radius:12px;border:1px solid #D8DFEB;background:#fff;font-weight:800;font-size:16px;text-decoration:none;color:var(--brand2)}
.dgo:hover{background:#F5F8FD}
.dgo-xl{background:linear-gradient(135deg,#1E3F7A,#2C5BB0);color:#fff;border:0;box-shadow:0 4px 12px rgba(30,63,122,.25)}
.dgo-xl:hover{background:linear-gradient(135deg,#17325F,#244C96);color:#fff}
.dgen{width:100%;margin-top:8px;animation:none!important}
.dschool{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.dschool img{width:64px;height:64px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff}
.dschool .nologo{width:64px;height:64px;border-radius:12px;border:2px dashed #CBD5E1;display:flex;align-items:center;justify-content:center;color:#94A3B8}
.dschool b{font-size:18px;font-family:var(--head)}
.dshift+.dshift{margin-top:12px}
.dsh{display:block;font-size:16px;margin-bottom:4px}
.ddays{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.ddays .pill{font-size:14px}
table.dbell{width:100%;border-collapse:collapse;font-size:15px}
.dbell td{padding:6px 10px;border-bottom:1px solid #EEF1F6}
.dbell td:last-child{text-align:end;font-family:'Space Grotesk',sans-serif;font-weight:600}
.dbell tr.brk td{background:#FFF8E6;color:#92400E;font-weight:700}
.dnums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.dnums span{display:flex;flex-direction:column;align-items:center;background:#F3F7FD;border-radius:12px;padding:10px;font-size:14px;font-weight:600;color:#475569}
.dnums b{font-size:28px;font-family:'Space Grotesk',sans-serif;color:var(--brand1)}
.dnums .bad{background:#FEF2F2}.dnums .bad b{color:#DC2626}
.dmiss{margin-bottom:6px!important}.dmiss li{font-size:15px;padding:6px 10px;border-radius:8px;background:#FFF7F7;border:1px solid #FDE2E2}
.dline{font-size:16px;margin:0 0 8px}.dline .ok{color:#15803D;font-weight:700}
.dlink{cursor:pointer;color:var(--brand2)}.dlink:hover{background:#F5F3FF!important;border-color:#C4B5FD!important}
.dstat .dl{font-size:22px}
/* school settings — colored sections, bigger type */
.scard{background:#fff;border:1px solid #E1E6EF;border-radius:18px;box-shadow:var(--sh1);padding:0 0 18px;margin-bottom:16px;overflow:hidden}
.scard>header{display:flex;align-items:center;gap:12px;padding:14px 20px;margin-bottom:14px;color:#fff}
.scard>header h2{flex:1;margin:0;font-family:var(--head);font-size:21px;font-weight:800;color:#fff}
.scard>header .btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);box-shadow:none;color:#fff}
.scard>header .btn:disabled{opacity:.6}
.scard>*:not(header){margin-inline:20px}
.sic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.scard-id>header{background:linear-gradient(135deg,#1E3A8A,#3B82F6)}
.scard-time>header{background:linear-gradient(135deg,#0F766E,#2DD4BF)}
.scard-rooms>header{background:linear-gradient(135deg,#6D28D9,#A78BFA)}
.shint{color:#5B6B87;font-size:14.5px;margin-top:0;margin-bottom:12px}
.sid{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.slogos{display:flex;flex-direction:column;gap:12px;width:200px}
.slogo{display:flex;flex-direction:column;align-items:center;gap:6px;background:#F5F8FD;border:1px solid #E3E9F3;border-radius:14px;padding:10px}
.slab{font-weight:700;font-size:14.5px;color:#24365C}
.slogo .logo-box{width:96px;height:96px;border-radius:14px;background:#fff;border:2px dashed #C7D2E3;display:flex;align-items:center;justify-content:center;color:#94A3B8;overflow:hidden}
.slogo .logo-box img{width:100%;height:100%;object-fit:contain}
.sfields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 18px;min-width:280px}
.sfield{display:flex;flex-direction:column;gap:6px}
.sfield-wide{grid-column:1/-1}
.sfield label{font-size:15.5px;font-weight:700;color:#24365C}
.scard .input,.scard select.input{font-size:16.5px;min-height:46px;padding:8px 12px}
.scard .input.sbig{font-size:21px;font-weight:700;font-family:var(--head);min-height:52px}
.scard .seg button{font-size:16px;min-height:40px}
.sout{min-height:46px;display:flex;align-items:center;padding:0 12px;background:#F3F6FB;border-radius:10px;font-size:17px;font-weight:700;color:#24365C}
.sgrid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.sdays{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sdays button{min-height:44px;min-width:92px;border-radius:12px;border:2px solid #D3DBE8;background:#fff;font:inherit;font-size:16px;font-weight:700;color:#5B6B87;cursor:pointer}
.sdays button[aria-pressed=true]{background:linear-gradient(135deg,#0F766E,#14B8A6);border-color:#0F766E;color:#fff;box-shadow:0 3px 10px rgba(15,118,110,.3)}
.sshift+.sshift{border-top:1px dashed #D3DBE8;padding-top:14px;margin-top:14px}
.sshift h3{font-family:var(--head);font-size:18px;margin:0 0 10px;color:#0F766E}
.ssum{margin-top:12px;display:inline-block;background:#ECFDF5;color:#065F46;border-radius:999px;padding:5px 14px;font-weight:700;font-size:15px}
.scard-rooms .sgrid4 input{max-width:none}
.scard .field label{font-size:15.5px;font-weight:700;color:#24365C}.scard .field .input{width:100%}
/* settings: compact, fits one screen */
.scard{margin-bottom:10px;padding-bottom:12px;border-radius:14px}
.scard>header{padding:8px 14px;margin-bottom:10px;gap:10px}
.scard>header h2{font-size:17.5px}
.scard>*:not(header){margin-inline:14px}
.sic{width:32px;height:32px;border-radius:9px}
.scard>header .btn{min-height:32px;padding:0 12px}
.sid{gap:14px}
.slogo{padding:6px 8px;gap:4px;width:150px}
.slogo .logo-box{width:66px;height:66px;border-radius:12px}
.sfields{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px}
.sfield-wide{grid-column:span 2}
.sfield{gap:3px}
.sfield label,.scard .field label{font-size:14px}
.scard .input,.scard select.input{font-size:15px;min-height:38px;padding:5px 10px}
.scard .input.sbig{font-size:17px;min-height:38px}
.sout{min-height:38px;font-size:15px}
.scard .seg button{font-size:14.5px;min-height:32px}
.sduo{display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:start}
@media (max-width:1100px){.sduo{grid-template-columns:1fr}.sfields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sdays{gap:5px;margin-bottom:8px}
.sdays button{min-height:36px;min-width:0;flex:1;font-size:14.5px;border-radius:10px}
.sgrid4{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.sshift+.sshift{padding-top:10px;margin-top:10px}
.sshift h3{font-size:16px;margin-bottom:6px}
.ssum{margin:0;padding:4px 12px;font-size:14px}
.scard-rooms .sgrid4{grid-template-columns:repeat(2,minmax(0,1fr))}

.tc-name{color:var(--tcc)!important;font-family:var(--head);font-weight:800;font-size:16px;text-decoration:none!important;border:0!important}
.tc-subs{display:flex;flex-wrap:wrap;gap:5px}
.tc-sub{display:inline-flex;align-items:center;gap:5px;background:var(--c);color:#fff;border-radius:9px;padding:3px 10px;font-size:14.5px;font-weight:800;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.tc-sub b{background:rgba(255,255,255,.3);border-radius:6px;padding:0 6px;font-family:'Space Grotesk',sans-serif}
.tc-load{display:inline-flex;min-width:42px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#FFF1E8;color:#C2410C;font-family:'Space Grotesk',sans-serif;font-size:18px}
.tc-load.over{background:#FDECEA;color:#B42318}
/* assign page */
.shell .as-tbl{font-size:16px}
.shell .as-tbl th{font-size:15.5px!important;font-weight:800}
.as-subj{width:1%;white-space:nowrap}
.as-n{width:1%;white-space:nowrap}
.as-n b{display:inline-flex;min-width:38px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#FDEDF5;color:#BE185D;font-family:'Space Grotesk',sans-serif;font-size:18px}
.as-chip{display:inline-block;background:var(--c);color:#fff;border-radius:9px;padding:4px 12px;font-weight:800;font-size:15.5px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.as-multi{display:inline-flex;align-items:center;gap:3px;margin-inline-start:6px;border:1.5px dashed #F472B6;background:#fff;color:#BE185D;border-radius:8px;padding:2px 8px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;vertical-align:middle}
.as-multi:hover{background:#FDF2F8}
.shell .as-tbl select.as-sel{font-size:15px;min-height:36px}
.shell .as-grades{gap:5px}
.shell .as-grades button{font-size:16px;font-weight:800;min-height:40px;border-radius:10px;color:var(--gc,#1E3A8A);border:1.5px solid color-mix(in srgb,var(--gc,#2563EB) 30%,#fff);background:color-mix(in srgb,var(--gc,#2563EB) 6%,#fff);border-inline-start:5px solid var(--gc,#2563EB)}
.shell .as-grades button[aria-pressed=true]{background:var(--gc,#2563EB);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--gc,#2563EB) 35%,transparent)}
.shell .as-grades button .ok{color:inherit}
.mu-top{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:6px}
.mu-top label{font-weight:800;color:#C2410C}
.mu-top select{max-width:360px;width:100%;font-size:16px}
.mu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;max-height:46vh;overflow:auto}
.mu-c{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;border:1.5px solid color-mix(in srgb,var(--gc) 30%,#fff);border-inline-start:5px solid var(--gc);border-radius:10px;padding:6px 10px;cursor:pointer;background:#fff}
.mu-c.on{background:color-mix(in srgb,var(--gc) 10%,#fff)}
.mu-c input{grid-row:1/3}
.mu-n{font-weight:800;color:var(--gc);font-size:15.5px}
.mu-p{font-family:'Space Grotesk',sans-serif;font-size:17px}
.mu-c small{grid-column:2/4;color:#64748B;font-size:12.5px}
.mu-sum{text-align:center;margin-top:8px;font-weight:800;color:#BE185D}
/* lesson dialog: other classes */
.ls-more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-top:6px;max-height:180px;overflow:auto}
.ls-mo{border:1.5px solid #D6E2FB;border-radius:9px;padding:4px 8px;background:#fff;font-weight:700}
.ls-mo.on{background:#EAF1FF;border-color:#2563EB}
.ls-mo.mine{background:#ECFDF5;border-color:#10B981;opacity:.85}
.ls-mo b{margin-inline-start:auto;font-family:'Space Grotesk',sans-serif;color:#1D4ED8}
.ls-mo{display:flex;align-items:center;gap:6px}
.shell .as-grades{flex:0 0 150px;width:150px}
.shell .as-grades button{white-space:nowrap;font-size:15px;justify-content:space-between}
/* timetable: centered big actions, full class names */
.pg-timetable .page-head{position:relative}
.tt-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:10px;align-items:center}
.tt-center .btn-generate{font-size:20px!important;min-height:54px!important;padding:0 30px!important}
.tt-center .tt-test{min-height:50px;font-size:17px;padding:0 20px;border:2px solid #10B981;color:#047857;background:#ECFDF5;font-weight:800}
.tt-center .tt-test:hover{background:#D1FAE5}
@media (max-width:1100px){.tt-center{position:static;transform:none}}
.whole th.wl{font-size:13.5px!important;font-weight:800;color:#1E3A8A;padding:0 8px!important;width:auto!important;min-width:70px}
.pg-timetable .page-head p{max-width:24vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* page titles: centered and bigger (all pages except the timetable which has its big buttons in the middle) */
.shell .main:not(.pg-timetable) .page-head{position:relative;min-height:52px;justify-content:flex-end}
.shell .main:not(.pg-timetable) .page-head>div:first-child{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:0;pointer-events:none;max-width:46%}
.shell .main:not(.pg-timetable) .page-head::before{display:none}
.shell .main:not(.pg-timetable) .page-head h1{font-size:27px!important;display:inline-block;padding-bottom:2px;border-bottom:4px solid var(--acc,#F5A524);border-radius:2px}
.shell .main:not(.pg-timetable) .page-head p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell .main:not(.pg-timetable) .page-actions{margin-inline-start:auto;flex-direction:row-reverse}
/* teacher form */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.sbox{background:#FFF8E6;border:1px solid #F7D9A0;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13.5px;text-align:center}
.shell .main:not(.pg-timetable) .page-head>div:first-child{max-width:34%}
.pg-teachers .page-head p,.pg-subjects .page-head p,.pg-assign .page-head p{display:none}
.shell .main:not(.pg-timetable) .page-head>div:first-child{position:static;transform:none;flex:1;max-width:none;min-width:0}
.ls-rem{margin-top:6px;text-align:center;font-weight:800;font-size:14px;background:#ECFDF5;color:#047857;border-radius:9px;padding:5px 8px}
.ls-rem.over{background:#FDECEA;color:#B42318}
.tc-load{min-width:64px;padding:0 8px}
.tc-rem{font-size:12px;font-weight:800;color:#047857;margin-top:2px}.tc-rem.over{color:#B42318}
.rstaff-sum{width:auto!important;min-width:420px;margin:0 auto 10px}
.rstaff-sum td,.rstaff-sum th{padding:5px 14px!important;font-size:14px}
.rstaff-sum tr.tot{background:#FFF7E0}
.rstaff tr.grp th{background:#EEF2FF;color:#1E3A8A;text-align:start;font-size:13.5px;padding:5px 10px}
.rstaff td.subs{text-align:start;font-size:12.5px}
.rstaff{table-layout:auto!important}
.rstaff th:nth-child(1),.rstaff td:nth-child(1){width:34px}
.rstaff th:nth-child(3),.rstaff td:nth-child(3){width:110px}
.rstaff th:nth-child(5),.rstaff td:nth-child(5){width:80px}
.rstaff th:nth-child(4),.rstaff td:nth-child(4){width:auto}
.rstaff-sum{table-layout:auto!important}
.rstaff-sum th.nm{white-space:nowrap}
/* ===== My programs ===== */
.pg-programs{--acc:#7C3AED;--acc-s:#F3EEFF}
.nv-programs .nvi{background:linear-gradient(135deg,#F59E0B,#FBBF24)}
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;background:#fff;border:1px solid #E1E6EF;border-radius:14px;padding:8px 14px}
.pg-plan{font-weight:800;color:#5B21B6;font-size:15px}
.pg-new{background:linear-gradient(135deg,#7C3AED,#A78BFA)!important;border:0}
.pg-limit{font-weight:700;color:#92400E;background:#FFF8E6;border-radius:9px;padding:5px 10px;font-size:13.5px}
.pg-sec{margin-bottom:14px}
.pg-h{font-family:var(--head);font-size:19px;font-weight:800;margin:4px 2px 8px}
.pg-h.done{color:#047857}.pg-h.wip{color:#B45309}
.pg-h small{color:#64748B;font-size:14px}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.pg-card{background:#fff;border:1px solid #E1E6EF;border-radius:16px;padding:12px 14px;box-shadow:var(--sh1);border-top:5px solid #F59E0B;display:flex;flex-direction:column;gap:8px}
.pg-card.fin{border-top-color:#10B981}
.pg-card.cur{box-shadow:0 0 0 3px #C4B5FD,var(--sh1)}
.pg-top{display:flex;align-items:center;gap:10px}
.pg-ic{font-size:26px}
.pg-name{font-family:var(--head);font-size:18px;color:#0E1F3D;display:block}
.pg-label{color:#6D28D9;font-weight:700;font-size:14px}
.pg-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:#475569}
.pg-acts{display:flex;flex-wrap:wrap;gap:6px}
.pg-acts .btn{min-height:34px;font-size:14px}
.pg-copy{color:#6D28D9!important;border-color:#DDD0FB!important;background:#F7F3FF!important}
.pg-empty{color:#64748B;background:#fff;border:1px dashed #CBD5E1;border-radius:12px;padding:12px;text-align:center}
.prog-chip{display:inline-flex;align-items:center;gap:6px;max-width:42vw;background:#FFF8E6;border:1.5px solid #F7D9A0;color:#78350F;border-radius:999px;padding:4px 12px;text-decoration:none;font-size:13.5px;white-space:nowrap;overflow:hidden}
.prog-chip.fin{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}
.prog-chip b{overflow:hidden;text-overflow:ellipsis}
.prog-chip em{font-style:normal;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.fin-banner{background:linear-gradient(90deg,#ECFDF5,#F0FDF9);border:1px solid #A7F3D0;color:#065F46}
.btn.btn-finish{background:linear-gradient(135deg,#059669,#10B981)!important;border:0;color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.35)}
.ow-lim{min-width:86px}
.sday{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.sday>button{width:100%}
.sday-n{width:100%;border:1.5px solid #F59E0B;border-radius:8px;background:#FFFBEB;color:#92400E;font:inherit;font-weight:800;font-size:13.5px;text-align:center;padding:2px 0;min-height:28px}
.sday-off{text-align:center;font-size:12.5px;color:#94A3B8;min-height:28px;line-height:28px}
.scard-time .sfield:has(.skinds)>label,.scard-time .sfield:has(.sdays)>label{display:none}
.scard-time .skinds{margin-bottom:6px}
.sday-n{min-height:24px;padding:0}
.sday-off{min-height:24px;line-height:24px}
.scard-id .sfields{row-gap:2px}
.scard .input,.scard select.input{min-height:34px}
.scard-time .sgrid4{row-gap:4px}
.stoprow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:6px}
.stoprow .ssum{justify-self:start;font-size:13px;padding:3px 10px}
.stoprow .skinds{margin:0}
.sdetail{justify-self:end;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#0F766E;text-decoration:none;border:1.5px solid #99E0D6;border-radius:999px;padding:3px 10px;background:#F0FBF9}
.sbreaks .sadd{grid-column:auto;align-self:stretch;justify-self:stretch}
.cons-tg{border:1.5px solid #c9d3e3;background:#f4f7fb;color:#4a5a75;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.cons-tg.must{background:#fff1e6;border-color:#f08a3c;color:#b4520f}
.cons-tg:disabled{opacity:.6;cursor:default}
/* ---- distribution sheet (ورقة توزيع الحصص) ---- */
.ys-panel{display:flex;align-items:center;gap:16px;padding:16px 20px;margin:0 0 14px;border-radius:16px;background:linear-gradient(135deg,#1E3A6B 0%,#2F5FA8 100%);color:#fff;box-shadow:0 8px 22px rgba(30,58,107,.25)}
.ys-badge{flex:none;width:52px;height:52px;border-radius:50%;background:#FFC83D;color:#1E3A6B;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ys-txt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ys-txt b{font-size:20px}
.ys-txt span{font-size:14px;opacity:.92;line-height:1.5}
.ys-btns{display:flex;gap:8px;flex-wrap:wrap}
.ys-btns .btn{font-size:15px;padding:10px 16px}
.ys-panel .btn.btn-primary{background:#fff !important;color:#1E3A6B !important;border:0}
.modal .ys-panel{margin:0}
@media (max-width:760px){.ys-panel{flex-direction:column;text-align:center}.ys-btns{justify-content:center}}
.ys-top{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 14px;background:#FFC83D;color:#1E3A6B;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(255,200,61,.4)}
.ys-top:hover{filter:brightness(1.05)}
.ys-rev{display:flex;flex-direction:column;gap:10px}
.ys-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ys-stats div{background:#EEF3FB;border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.ys-stats b{font-size:26px;color:#1E3A6B}
.ys-stats span{font-size:13px;color:#4a5a75}
.ys-box{border:1.5px solid #dbe3f0;border-radius:12px;padding:10px 14px;background:#fff}
.ys-box ul{margin:6px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.7}
.ys-box.err{border-color:#f3b4b4;background:#fff6f6}
.ys-box.err>b{color:#B42318}
.ys-box.warn{border-color:#f5d48a;background:#fffbef}
.ys-box.warn>b{color:#8a5a00}
.ys-box.ask{border-color:#9ec5f5;background:#f3f8ff}
.ys-box.ask label{cursor:pointer}
.ys-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ys-ok{text-align:center}
.ys-ok-big{font-size:48px}
.ys-ok-l{font-size:18px;font-weight:700;color:#1E7A4C;margin:4px 0 12px}
.ys-ok-next{margin:0 0 8px}
.ys-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.ys-steps li{counter-increment:s}
.ys-steps button{width:100%;display:flex;align-items:center;gap:10px;border:1.5px solid #c9d8ee;background:#f5f9ff;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;color:#1E3A6B;cursor:pointer}
.ys-steps button::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:#1E3A6B;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ys-steps button:hover{background:#e8f1ff}
.ys-reset-name{font-size:17px;margin:0 0 8px}
.ys-reset-d{background:#fff6f6;border:1.5px solid #f3b4b4;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;margin:0 0 10px}
/* a left-over card is picked: highlight its class row */
.whole tr.w-focus td{background:#FFF6D6}
.whole tr.w-focus th.wl{background:#F5A524 !important;color:#2A1A00 !important;font-weight:800}
.whole tr.w-focus{outline:3px solid #F5A524;outline-offset:-2px}
.whole tr.w-focus td.can{background:#CDEFD9;outline:2px solid #1E7A4C;outline-offset:-2px;cursor:pointer}
.whole tr.w-focus td.cant{background:#FBE3E0}
.ucard{cursor:pointer}
.ucard.on{outline:3px solid #F5A524;outline-offset:2px;transform:translateY(-2px)}
.whole tr.w-focus td{box-shadow:inset 0 3px 0 #F5A524,inset 0 -3px 0 #F5A524}
.whole tbody:has(tr.w-focus) tr:not(.w-focus) .wcard{opacity:.28}
.whole tbody:has(tr.w-focus) tr:not(.w-focus) th.wl{opacity:.45}
.sg-box{border:2px solid #F5A524;background:#FFF8E6;border-radius:12px;padding:12px 14px}
.sg-box>b{font-size:16px;color:#7A4A00}
.sg-box p{margin:6px 0}
.sg-box ul{margin:6px 0;padding-inline-start:20px;line-height:1.9;font-size:15px}
.sg-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.crash{max-width:560px;margin:40px auto;text-align:center;background:#fff;border:2px solid #f3b4b4;border-radius:16px;padding:24px}
.crash-ic{font-size:44px}
.crash h2{margin:6px 0;color:#B42318}
.crash p{line-height:1.8}
.crash-acts{display:flex;gap:10px;justify-content:center;margin:12px 0}

/* ===== Teacher card (old-browser safe: margins, no flex gap / inset) ===== */
.tcard-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tcard-nav .btn{max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard-list{display:inline-flex;align-items:center;font-weight:700;color:#1D3A6B;text-decoration:none}
.tcard-list svg{margin-inline-end:6px}
.tcard-head{display:flex;align-items:flex-start;background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.tcard-ava{flex:0 0 64px;width:64px;height:64px;border-radius:50%;background:#1D3A6B;color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-inline-end:16px}
.tcard-who{flex:1 1 auto;min-width:0}
.tcard-who h1{margin:0 0 8px;font-size:24px;color:#0F172A}
.tcard-meta{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tcard-chip{display:inline-flex;align-items:center;background:#F1F5F9;color:#334155;border-radius:999px;padding:4px 12px;font-size:14px;margin:0 0 6px;margin-inline-end:8px;text-decoration:none}
.tcard-chip svg{margin-inline-end:4px}
.tcard-chip.warn{background:#FEF3C7;color:#92400E}
.tcard-chip.wa{background:#DCFCE7;color:#166534;font-weight:700}
.tcard-load{margin-top:6px;font-size:14px;color:#334155}
.tcard-load em{font-style:normal;color:#64748B}
.tcard-load em.over{color:#B91C1C;font-weight:700}
.tcard-bar{height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin-top:4px;max-width:420px}
.tcard-bar i{display:block;height:100%;background:#16A34A;border-radius:99px}
.tcard-bar i.over{background:#DC2626}
.tcard-acts{flex:0 0 auto;margin-inline-start:12px}
.tcard-box{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.tcard-box header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.tcard-box h2{display:flex;align-items:center;font-size:18px;margin:0;color:#1D3A6B}
.tcard-box h2 svg{margin-inline-end:6px}
.tcard-tbl td,.tcard-tbl th{vertical-align:middle}
.tcard-sub{display:inline-block;color:#fff;border-radius:8px;padding:3px 10px;font-weight:700;font-size:14px}
.tcard-rowacts{white-space:nowrap}
.tcard-btn{display:inline-flex;align-items:center;border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:4px 8px;font:inherit;font-size:13px;cursor:pointer;margin:2px;color:#1E293B}
.tcard-btn svg{margin-inline-end:3px}
.tcard-btn:hover{background:#F1F5F9}
.tcard-btn.red{color:#B91C1C;border-color:#FCA5A5}
.tcard-btn:disabled{opacity:.5;cursor:default}
.tcard-grid{border-collapse:collapse;width:100%;min-width:420px}
.tcard-grid th,.tcard-grid td{border:1px solid #E2E8F0;text-align:center;padding:0;height:40px}
.tcard-grid thead th{background:#F8FAFC;font-size:13px;color:#475569;height:30px}
.tcard-grid tbody th{background:#F8FAFC;font-size:14px;padding:0 8px;white-space:nowrap;width:1%}
.tcard-grid td.none{background:#F1F5F9}
.tcard-grid td.on button,.tcard-grid td.off button{width:100%;height:40px;border:0;font-size:18px;font-weight:800;cursor:pointer;display:block}
.tcard-grid td.on button{background:#DCFCE7;color:#166534}
.tcard-grid td.off button{background:#FEE2E2;color:#B91C1C}
.tcard-grid td button:disabled{cursor:default}
.tcard-grid td.offw{background:repeating-linear-gradient(45deg,#FEE2E2,#FEE2E2 6px,#fff 6px,#fff 12px)}
.tcard-week td{height:52px;padding:3px}
.tcard-cell{border-inline-start:4px solid #64748B;background:#F8FAFC;border-radius:6px;padding:3px 5px;font-size:12px;line-height:1.3;text-align:start}
.tcard-cell b{display:block;font-size:13px}
.tcard-cell span{color:#475569}
.tcard-pick{max-height:60vh;overflow:auto}
.tcard-pickrow{display:flex;flex-wrap:wrap;margin-bottom:6px}
